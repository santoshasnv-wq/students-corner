<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --text:#0E1A3A; --muted:#4A5677; --line:#D8DDEC;
  --accent:#14338F; --accent-soft:#E6ECFB; --on-accent:#FFFFFF;
  --mark:#E6B84A; --mark-ink:#2E2200; --danger:#B3261E;
  --font-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080D20; --surface:#111A38; --text:#EEF1FB; --muted:#A5B0CE; --line:#26325E;
    --accent:#8FB0FF; --accent-soft:#18265A; --on-accent:#08112E; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080D20; --surface:#111A38; --text:#EEF1FB; --muted:#A5B0CE; --line:#26325E;
  --accent:#8FB0FF; --accent-soft:#18265A; --on-accent:#08112E; --danger:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1.0625rem;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-.015em}
h1{font-weight:800;font-size:clamp(2.1rem,5.4vw,3.4rem);letter-spacing:-.025em}
h2{font-weight:800;font-size:clamp(1.45rem,3.2vw,2rem)}
h3{font-weight:600;font-size:1.25rem;line-height:1.2}
h4{font-weight:600;font-size:1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:1.25rem 1.25rem 3.5rem}
.site-head{display:flex;align-items:center;gap:.65rem;padding:.4rem 0 1.75rem;font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.site-head small{font-family:var(--font-body);font-weight:400;font-size:.95rem;color:var(--muted)}
.lead{font-size:1.15rem;color:var(--muted);max-width:58ch;margin-top:1rem}

/* welcome */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:start}
.hero-art{max-width:460px;width:100%;justify-self:center;position:sticky;top:1rem}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:1.5rem}.hero-art{order:2;position:static}}
form{margin-top:1.75rem;max-width:560px}
.field{margin:0 0 1.35rem;padding:0;border:0;min-width:0}
.field>label,.field>legend{display:block;font-weight:700;margin-bottom:.5rem;padding:0}
.note{font-weight:400;color:var(--muted)}
input[type=text]{width:100%;min-height:48px;padding:.65rem .85rem;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=text]:focus-visible{border-color:var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;padding:.55rem .9rem;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;line-height:1.25}
.chip small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.chip input:checked + span{border-color:var(--accent);background:var(--accent-soft)}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:3px}
.hint{font-size:.9rem;color:var(--muted);margin-top:.6rem}
.err{color:var(--danger);font-weight:700;margin-top:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7rem 1.4rem;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.07)}

/* quiz */
.quiz{max-width:780px;margin:0 auto}
.progress-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:.5rem}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease}
.q-stem{margin-top:2.25rem;color:var(--muted)}
.q-text{margin-top:.35rem;font-family:var(--font-display);font-weight:600;font-size:clamp(1.55rem,4vw,2.3rem);line-height:1.15;letter-spacing:-.015em;outline:none}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin:2rem 0 1.25rem;border:0;padding:0}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:92px;padding:.6rem .4rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;font-weight:700;line-height:1.2}
.face b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.opt:hover .face{border-color:var(--accent)}
.opt input:checked + .face{border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked + .face b{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt input:focus-visible + .face{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:640px){
  .opts{grid-template-columns:1fr;gap:.5rem}
  .face{flex-direction:row;justify-content:flex-start;min-height:54px;padding:.5rem .9rem;gap:.8rem;text-align:left}
}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;padding:.5rem .25rem;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px}
.linkbtn[disabled]{visibility:hidden}

/* results */
.print-only{display:none}
.res-head{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:flex-end}
.res-head .lead{margin-top:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.profile{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:2rem;align-items:center;margin-top:2rem;padding:1.5rem;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
@media (max-width:820px){.profile{grid-template-columns:1fr;padding:1rem}}
.top3{display:grid;gap:1.1rem}
.t3{padding-left:1rem;border-left:5px solid var(--line)}
.t3:first-child{border-left-color:var(--mark)}
.t3 h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem}
.t3 h3 span{font-family:var(--font-body);font-weight:400;font-size:.95rem;color:var(--muted)}
.t3 p{margin-top:.3rem;max-width:52ch}
.t3 .school{color:var(--muted);font-size:.95rem}
.low-note{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;background:var(--accent-soft)}
section.block{margin-top:3rem}
.sub{color:var(--muted);max-width:70ch;margin-top:.6rem}
.filters{display:flex;flex-wrap:wrap;gap:.85rem 1.5rem;align-items:center;margin:1.1rem 0 1.25rem;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.filters label.f{display:flex;align-items:center;gap:.5rem;font-weight:700}
.filters select{min-height:44px;padding:.4rem .6rem;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.filters input[type=checkbox].plain{width:20px;height:20px;accent-color:var(--accent)}
.filters .regions{flex:1 1 100%}
.filters .regions .chip span{padding:.4rem .8rem;font-size:.95rem}
.filters .regions .chip small{display:none}
.filter-title{font-weight:700;margin-bottom:.4rem}
.count{color:var(--muted);margin-bottom:.75rem}
.list{display:grid;gap:.8rem}
details.career{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.career[open]{border-color:var(--accent)}
details.career>summary{list-style:none;display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;padding:1.1rem 1.25rem;cursor:pointer}
details.career>summary::-webkit-details-marker{display:none}
.c-main{display:block;flex:1;min-width:0}
.c-sum{display:block;margin-top:.3rem;color:var(--muted)}
.c-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chip-fit{display:inline-block;padding:.15rem .65rem;border-radius:999px;font-size:.85rem;font-weight:700}
.chip-fit.top{background:var(--mark);color:var(--mark-ink)}
.chip-fit.mid{background:var(--accent-soft);color:var(--accent)}
.chip-fit.low{border:1px solid var(--line);color:var(--muted)}
.tag{display:inline-block;padding:.15rem .65rem;border-radius:6px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.fit-bar{display:block;height:5px;margin-top:.8rem;border-radius:3px;background:var(--line);max-width:340px}
.fit-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.chev{flex:none;width:12px;height:12px;margin-top:.55rem;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(45deg);transition:transform .2s ease}
details[open] .chev{transform:rotate(-135deg)}
.c-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.25rem 1.75rem;padding:1.1rem 1.25rem 1.3rem;border-top:1px solid var(--line)}
.c-body h4{margin-bottom:.4rem}
.c-body ul{margin:0;padding-left:1.15rem}
.c-body li{margin:.15rem 0}
.c-wide{grid-column:1/-1;padding:.9rem 1rem;border-radius:10px;background:var(--accent-soft)}
.c-wide ul{list-style:none;padding:0}
.c-wide li{margin:.35rem 0}
.c-wide .none{color:var(--muted)}
.more{margin-top:1rem}
.empty{padding:1.25rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.steps{margin:1rem 0 0;padding-left:1.4rem;max-width:62ch}
.steps li{margin:.5rem 0;padding-left:.3rem}
.disclaimer{margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;max-width:80ch}

/* NAAC grade chips and college cards */
.g{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;vertical-align:middle}
.g3{background:var(--mark);color:var(--mark-ink)}
.g2{background:var(--accent-soft);color:var(--accent)}
.g1{border:1px solid var(--line);color:var(--muted)}
.naac-note{margin-top:1.25rem;padding:1rem 1.2rem;border-left:5px solid var(--mark);border-radius:0 10px 10px 0;background:var(--surface);max-width:80ch}
.naac-note h3{font-size:1.05rem;margin-bottom:.4rem}
.naac-note p+p{margin-top:.5rem}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.inst{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);break-inside:avoid}
.inst-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.inst h3{font-size:1.05rem;line-height:1.25}
.inst .loc{margin-top:.2rem;color:var(--muted);font-size:.95rem}
.inst .note2{margin-top:.5rem;font-size:.95rem}
.inst .fields{margin-top:.5rem;font-size:.9rem;color:var(--muted)}
.inst .src{margin-top:.5rem;font-size:.82rem;color:var(--muted)}


/* admissions */
.st{display:inline-block;padding:.05rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.st-open{background:var(--accent);color:var(--on-accent)}
.st-soon{background:var(--mark);color:var(--mark-ink)}
.st-info{background:var(--accent-soft);color:var(--accent)}
.st-closed{border:1px solid var(--line);color:var(--muted)}
.left{display:inline-block;margin-left:.4rem;padding:.02rem .5rem;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:700}
.left.urgent{background:var(--mark);color:var(--mark-ink)}
.btn.small{min-height:40px;padding:.35rem .9rem;font-size:.92rem;border-radius:8px}
.alert{margin-top:1.25rem;padding:.85rem 1.1rem;border-left:5px solid var(--mark);border-radius:0 10px 10px 0;background:var(--surface)}
.adm{margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--line);font-size:.95rem}
.adm h4{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.4rem}
.adm p{margin-top:.35rem}
.adm .links{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.5rem}
.adm-none{color:var(--muted)}
.dls{display:grid;gap:.8rem;margin-top:1rem}
.dl{display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;justify-content:space-between;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dl-main{flex:1 1 320px;min-width:0}
.dl h3{font-size:1.1rem}
.dl-when{margin-top:.3rem}
.dl-sub{margin-top:.25rem;color:var(--muted);font-size:.95rem}
.dl-side{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
.how{margin-top:1rem;display:grid;gap:.7rem;max-width:80ch}
.how details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 1.1rem}
.how summary{cursor:pointer;font-weight:700;padding:.9rem 0}
.how details[open] summary{border-bottom:1px solid var(--line)}
.how ul,.how ol{padding-left:1.3rem;margin:.8rem 0}
.how li{margin:.45rem 0}
.how .hint{margin:0 0 1rem}


.web{margin-top:.5rem;font-size:.95rem}
.web a,.tbl a{color:var(--accent);font-weight:700;word-break:break-all}
.vf{display:inline-block;margin-left:.3rem;padding:.02rem .5rem;border-radius:6px;font-size:.78rem;font-weight:700;vertical-align:middle}
.vf-ok{background:var(--accent);color:var(--on-accent)}
.vf-chk{background:var(--mark);color:var(--mark-ink)}
.toggle{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;min-width:640px}
.tbl th{position:static;text-align:left;padding:.7rem .9rem;background:var(--accent-soft);color:var(--text);font-family:var(--font-display);font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .hint{margin:0;font-size:.85rem}


.brand-mark{height:44px;width:auto;display:block;border-radius:10px;background:#FBF4E4;flex:none}
.brand-foot{display:flex;justify-content:center;margin-top:3rem}
.brand-foot img{width:100%;max-width:420px;height:auto;display:block;border-radius:18px;background:#FBF4E4}
.brand-foot+.contact{margin-top:1.1rem}
.contact{text-align:center;color:var(--muted);font-size:.95rem}
.contact a{color:var(--accent);font-weight:700}
.contact+.disclaimer{margin-top:1.5rem}
.print-only img{height:32px;width:auto;vertical-align:middle;margin-right:.6rem;border-radius:6px}


.sbars{display:grid;gap:.5rem;margin-top:1rem;max-width:620px}
.sb{display:grid;grid-template-columns:150px 1fr 120px;gap:.8rem;align-items:center}
.sb .bar.sm{height:10px}
.sb .sv{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.sb{grid-template-columns:1fr 1fr;row-gap:.2rem}.sb .bar.sm{grid-column:1/-1;order:3}}
.flow{list-style:none;padding:0;margin:1rem 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem}
.flow li{display:flex;flex-direction:column;gap:.3rem;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.flow b{color:var(--accent);font-family:var(--font-display)}
.flow .hint{margin:0;font-size:.9rem}
.c-warn{background:var(--mark);color:var(--mark-ink)}
.c-warn h4,.c-warn p{color:var(--mark-ink)}

/* motion and brand polish */
.site-head{justify-content:space-between;flex-wrap:wrap;gap:.8rem 1.2rem}
.brand{display:flex;align-items:center;gap:.65rem}
.topnav{display:flex;gap:.4rem;flex-wrap:wrap}
.topnav button{min-height:44px;padding:.4rem 1rem;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-family:var(--font-body);font-weight:700;font-size:.95rem;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.topnav button:hover{border-color:var(--accent);transform:translateY(-1px)}
.topnav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{transition:transform .15s ease,filter .15s ease,background .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.chip span,.face{transition:border-color .15s,background .15s,transform .15s}
.chip:hover span{border-color:var(--accent);transform:translateY(-1px)}
details.career{transition:border-color .2s ease,transform .2s ease}
details.career:hover{border-color:var(--accent)}
:root{interpolate-size:allow-keywords}
details.career::details-content{block-size:0;overflow:clip;transition:block-size .32s ease,content-visibility .32s ease allow-discrete}
details.career[open]::details-content{block-size:auto}
.ic{display:inline-grid;place-items:center;width:1.9em;height:1.9em;margin-right:.5rem;border-radius:50%;background:var(--accent-soft);font-size:.85em;vertical-align:middle}
.badge{display:inline-block;margin:0 0 1rem;padding:.4rem .9rem;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-size:.95rem}
.t3 h3 span b{font-weight:400}
.quiz{animation:qin .38s cubic-bezier(.2,.8,.2,1) both}
.quiz.sub .bar>i{background:var(--mark)}
.quiz.sub .opt input:checked + .face{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 24%,var(--surface))}
.quiz.sub .opt input:checked + .face b{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.opt input:checked + .face{animation:pop .3s ease}
.fit-bar i{transform-origin:left center;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.profile,section.block{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.hero-art svg{animation:float 7s ease-in-out infinite}
.shine{position:relative;overflow:hidden;border-radius:18px;line-height:0;max-width:420px;width:100%}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.26) 50%,transparent 58%);transform:translateX(-130%);animation:shine 7s ease-in-out 1.5s infinite}
.loading{display:grid;justify-items:center;text-align:center;gap:1rem;padding:5rem 1rem}
.compass{width:130px;height:130px}
.compass .needle{transform-box:view-box;transform-origin:60px 60px;animation:swing 1.1s ease-in-out infinite alternate}
.compass .ring{transform-box:view-box;transform-origin:60px 60px;animation:spin 1.6s linear infinite}
.thead{padding:1rem 0 .5rem;max-width:720px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem}
.tsvc{padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:transform .2s ease,border-color .2s ease}
.tsvc:hover{transform:translateY(-3px);border-color:var(--accent)}
.tsvc .ic{margin:0 0 .6rem;font-size:1.5rem;width:2.2em;height:2.2em}
.tsvc p{margin-top:.4rem;color:var(--muted);font-size:.97rem}
.tform{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem 1.2rem;max-width:900px;margin-top:1.2rem}
.tform .full{grid-column:1/-1}
.tform label{display:block;font-weight:700;margin-bottom:.35rem}
.tform input,.tform select,.tform textarea{width:100%;min-height:48px;padding:.65rem .85rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:inherit}
.tform textarea{min-height:130px;resize:vertical}
.tform .consent{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin:0}
.tform .consent input{width:22px;height:22px;min-height:0;margin-top:.15rem;flex:none;accent-color:var(--accent)}
.tform input:focus-visible,.tform select:focus-visible,.tform textarea:focus-visible{border-color:var(--accent);outline-offset:1px}
.tout{margin-top:1.4rem;padding:1.2rem;border:2px solid var(--accent);border-radius:14px;background:var(--surface);max-width:900px;animation:rise .4s ease both}
.tpre{margin:.8rem 0;padding:1rem;border-radius:10px;background:var(--accent-soft);white-space:pre-wrap;word-break:break-word;font-family:var(--font-body);font-size:.95rem}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes swing{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.topnav,.shine::after{display:none!important}.quiz,.profile,section.block,.fit-bar i{animation:none!important}}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;margin-top:1.4rem;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:.5rem;padding:1.5rem 1.3rem 1.3rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:transform .2s ease,border-color .2s ease}
.plan:hover{transform:translateY(-3px);border-color:var(--accent)}
.plan.best{border:2px solid var(--mark)}
.plan .ribbon{position:absolute;top:-.85rem;left:1rem;padding:.15rem .75rem;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:.85rem}
.plan .price{margin-top:.2rem}
.plan .price b{font-family:var(--font-display);font-size:2.3rem;letter-spacing:-.02em}
.plan ul{margin:.4rem 0 1rem;padding-left:1.15rem;flex:1}
.plan li{margin:.3rem 0}
.plan .btn{align-self:flex-start}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.flist{margin:.4rem 0 0;padding-left:1.1rem;font-size:.92rem}
.tform input[type=file]{padding:.55rem .6rem;min-height:0}
.terms{max-width:80ch;padding-left:1.3rem}
.terms li{margin:.75rem 0}
.hint a,.sub a,.consent a{color:var(--accent);font-weight:700}

/* student corner menu and step-by-step study abroad */
.menu{position:relative}
.menu-list{position:absolute;z-index:40;top:calc(100% + .35rem);left:0;min-width:230px;margin:0;padding:.4rem;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.menu-list[hidden]{display:none}
.topnav .menu-list button{width:100%;text-align:left;border:0;border-radius:10px;min-height:44px;background:transparent}
.topnav .menu-list button:hover{background:var(--accent-soft);transform:none}
.topnav .menu-list button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.crumb{font-size:.92rem;color:var(--muted);margin:0 0 .6rem}
.ctys{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem;margin-top:1rem}
.cty{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:1.1rem 1.2rem;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .2s ease,border-color .2s ease}
.cty:hover{transform:translateY(-3px);border-color:var(--accent)}
.cty .flag{font-size:2.2rem;line-height:1}
.cty .hint{margin:0}
.chipbtn{min-height:44px;padding:.45rem .9rem;border:2px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-weight:700;line-height:1.25;color:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.chipbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chipbtn small{font-weight:400;color:var(--muted);margin-left:.4rem}
.chipbtn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.4rem 0 1rem;border-bottom:2px solid var(--line)}
.tab{min-height:46px;padding:.5rem 1.1rem;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:transparent;font-family:var(--font-display);font-weight:600;font-size:1.05rem;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--mark)}
.tab:hover{color:var(--text)}
.tabpanel h3{font-size:1.15rem;margin:1.2rem 0 .5rem}
.tabpanel ul{padding-left:1.2rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem}
.costgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem;margin-top:.8rem}
.cost{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cost b{display:block;font-family:var(--font-display);font-size:1.45rem;margin:.2rem 0}
.cost.total{border:2px solid var(--mark)}

.chkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.6rem 1.2rem;margin-top:.4rem}
.chkgrid .consent{margin:0}

.founder{font-size:1.15rem;line-height:1.75;max-width:70ch;margin-top:.8rem}
.cdl{display:grid;grid-template-columns:minmax(130px,210px) 1fr;gap:.7rem 1.4rem;max-width:680px;margin:1.2rem 0}
.cdl dt{font-weight:700;color:var(--muted)}
.cdl dd{margin:0}
.cdl a,.footnav a{color:var(--accent);font-weight:700}
@media (max-width:560px){.cdl{grid-template-columns:1fr;gap:.1rem}.cdl dd{margin-bottom:.7rem}}
.footnav{margin-top:.2rem}

/* academic health check */
.chk{max-width:780px}
.chkq{margin:0 0 1.1rem;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.chkq legend{font-weight:700;padding:0 .4rem;line-height:1.45}
.chkq-ev{background:var(--accent-soft)}
.chkopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem;margin-top:.6rem}
.chkopts-col{grid-template-columns:1fr}
.chkopt{position:relative;display:block;cursor:pointer}
.chkopt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chkopt span{display:block;padding:.65rem .85rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,background .15s}
.chkopt:hover span{border-color:var(--accent)}
.chkopt input:checked+span{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chkopt input:focus-visible+span{outline:3px solid var(--mark);outline-offset:2px}
.abars{display:grid;gap:.8rem;margin-top:1rem}
.abar{display:grid;grid-template-columns:minmax(150px,270px) 1fr 52px 150px;gap:.8rem;align-items:center}
.abar .an{font-weight:700}
.abar .av{text-align:right;font-weight:700}
.abar .bar{height:12px}
@media (max-width:640px){.abar{grid-template-columns:1fr 52px;row-gap:.25rem}.abar .an{grid-column:1/-1}.abar .st{grid-column:1/-1;justify-self:start}}
.pt{border-collapse:collapse;width:100%;margin:.8rem 0}
.pt th,.pt td{border:1px solid var(--line);padding:.55rem .6rem;vertical-align:middle;text-align:left}
.pt th.bx,.pt td.bx{text-align:center;width:92px;font-size:.85rem}
.pt td.n,.pt th.n{width:44px;text-align:center}
.pt .box{display:inline-block;width:20px;height:20px;border:2px solid var(--text);border-radius:4px}
.pb{break-before:page}
@media print{.chkq,.abar,.pt tr{break-inside:avoid}}

/* hexagon */
.hx-grid{fill:none;stroke:var(--line);stroke-width:1.2}
.hx-axis{stroke:var(--line);stroke-width:1}
.hx-fill{fill:var(--accent);fill-opacity:.24;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.hx-dot{fill:var(--accent)}
.hx-dot.top{fill:var(--mark);stroke:var(--text);stroke-width:1.5}
.hx-name{fill:var(--text);font-family:var(--font-display);font-weight:800;font-size:16px}
.hx-sub{fill:var(--muted);font-size:13px}
.hx-shape{transform-box:view-box;transform-origin:200px 170px;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scale(.12);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hx-shape{animation:none}.bar>i,.chev{transition:none}}

@media print{
  html:root:root:root{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--line:#bbb;--accent:#0C7C86;--accent-soft:#eef7f7;--on-accent:#fff;color-scheme:light}
  :root{padding:0}
  .noprint,.filters,.actions,.more,.chev,.brand-foot{display:none!important}
  .print-only{display:block;color:var(--muted);margin-bottom:.5rem}
  .wrap{padding:0}
  details.career,.profile,.t3,.inst,.naac-note,.dl,.flow li{break-inside:avoid}
  .how details{border:0}
  .btn.small{border:0;padding:0;text-decoration:underline;color:var(--accent);background:none;min-height:0}
  .hx-shape{animation:none}

/* NPAT practice */

function buildQuestions(stream){
  const picks={};
  ORDER.forEach(t=>{
    const fixed=QPOOL[t].filter(x=>ANCHORS[t].includes(x[0])).map(x=>({text:x[0]}));
    const pool=QPOOL[t].filter(x=>!ANCHORS[t].includes(x[0])).map(x=>({text:x[0],st:x[1]}));
    const chosen=[];
    for(let n=0;n<2;n++){
      const w=pool.map(q=>(!stream||stream==='unsure'||!q.st.length)?2:((q.st.includes(stream)||(stream==='mbipc'&&(q.st.includes('mpc')||q.st.includes('bipc')))||(stream==='aec'&&q.st.includes('cec')))?4:0.5));
      let r=Math.random()*w.reduce((a,b)=>a+b,0),idx=0;
      for(;idx<w.length-1;idx++){r-=w[idx];if(r<=0)break;}
      chosen.push(pool.splice(idx,1)[0]);
    }
    picks[t]=shuffle(fixed.concat(chosen));
  });
  const out=[];
  for(let k=0;k<5;k++){shuffle([...ORDER]).forEach(t=>out.push({t,text:picks[t][k].text}));}
  return out;
}

function admBlock(i){

  }
  const left=a.iso?` <span class="left${daysLeft(a.iso)>=0&&daysLeft(a.iso)<=14?' urgent':''}">${dlText(a.iso)}</span>`:'';
  return `<div class="adm"><h4>Admissions <span class="st ${ST[a.st][1]}">${a.head||ST[a.st][0]}</span></h4>
    <p><strong>Deadline:</strong> ${a.dl}${left}</p>
    <p><strong>How you get in:</strong> ${a.route}</p>
    ${a.more?`<p class="hint">${a.more}</p>`:''}

    <p class="hint">Last checked ${ADM_CHECKED} from education portals’ reports of official notices. Confirm on the official site.</p></div>`;
}
function deadlinesHTML(){

const HOW_TO=`<div class="how">
 <details><summary>Before you start: documents and details to keep ready</summary>
  <ul><li>Class 10 and Class 12 marksheets (or the latest predicted or school results if Class 12 is still running).</li>
  <li>Aadhaar or another photo ID, and a recent passport-size photo and signature as scanned images.</li>
  <li>Category or income certificates, if you are applying under a reserved category or for a scholarship.</li>
  <li>A personal email address and a mobile number you will keep for the next year. Colleges send OTPs, admit cards and offers there.</li>
  <li>A debit card, credit card or UPI for the application fee. Fees are usually non-refundable, so confirm eligibility first.</li></ul>
 </details>
 <details><summary>Step by step: how to fill an online application form</summary>
  <ol>
   <li><strong>Find the official admissions page.</strong> Start from the link on a card above or the college’s own main site. A real institution’s address usually ends in .ac.in, .edu.in or .edu. Never apply through an agent’s page.</li>
   <li><strong>Check eligibility.</strong> Look at the Class 12 subjects, minimum marks and entrance test for your programme. Christ, for example, takes one form per programme.</li>
   <li><strong>Register an account.</strong> Use your own email and mobile number, verify the OTP, and note your login ID and password.</li>
   <li><strong>Fill in your details.</strong> Match your name, date of birth and marks to your marksheet and ID exactly. Choose the programme, campus and, where asked, the test city and date.</li>
   <li><strong>Upload documents.</strong> Check the size and format limits on the page before uploading your photo, signature and marksheets.</li>
   <li><strong>Pay the application fee online</strong> and save the receipt.</li>
   <li><strong>Submit and download the confirmation page.</strong> Keep a PDF or screenshot. If the portal has a correction window, check your form again during it.</li>
   <li><strong>Download your admit card</strong> when it is released, and take the test or interview on the date given.</li>
   <li><strong>Watch your email and the portal</strong> for results, counselling and offers. Pay seat fees only on the official portal.</li>
  </ol>
  <p class="hint">Apply well before the deadline. Portals slow down in the last days, and late fixes are often not allowed.</p>
 </details>
 <details><summary>Exam and college specific notes</summary>
  <ul>
   <li><strong>CUET-UG (Delhi University colleges and many central universities).</strong> You register once with NTA, not with each college. You fill in your details, choose your subjects (a portal reports up to five, including one language), upload your photo and signature, pay a fee based on the number of subjects, and download the confirmation page. After the results you follow each university’s own admission or counselling process.</li>

   <li><strong>Law (CLAT).</strong> Register on the Consortium of NLUs website, fill the form, upload documents and pay by 31 Oct 2026. A correction window usually follows the closing date.</li>
  </ul>
 </details>
 <details><summary>Avoid mistakes and fake sites</summary>
  <ul><li>Check that the college is on the UGC and NAAC lists before you pay anything.</li>
  <li>No genuine college sells a “guaranteed seat” or asks you to pay the fee to a personal account.</li>
  <li>Use one email and phone number for every form so nothing gets lost.</li>
  <li>Set calendar reminders for the application deadline, the admit card date, and the seat-fee deadline.</li></ul>

function hexSVG(pct,top){
  const cx=200,cy=170,r=100,lr=128;
  const ang=k=>(-90+60*k)*Math.PI/180;
  const pt=(k,s)=>[cx+Math.cos(ang(k))*r*s,cy+Math.sin(ang(k))*r*s];
  const poly=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let g='';
  [1/3,2/3,1].forEach(s=>{g+=`<polygon class="hx-grid" points="${poly(ORDER.map((t,k)=>pt(k,s)))}"/>`;});
  ORDER.forEach((t,k)=>{const p=pt(k,1);g+=`<line class="hx-axis" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`;});
  if(pct){
    const sp=ORDER.map((t,k)=>pt(k,Math.max(pct[t],0.05)));
    g+=`<g class="hx-shape"><polygon class="hx-fill" points="${poly(sp)}"/>`;
    ORDER.forEach((t,k)=>{g+=`<circle class="hx-dot${top&&top.includes(t)?' top':''}" cx="${sp[k][0].toFixed(1)}" cy="${sp[k][1].toFixed(1)}" r="${top&&top.includes(t)?7:4.5}"/>`;});
    g+='</g>';
  }
  ORDER.forEach((t,k)=>{
    const c=Math.cos(ang(k)),s=Math.sin(ang(k));
    const lx=cx+c*lr,ly=cy+s*lr;
    const anchor=Math.abs(c)<0.2?'middle':(c>0?'start':'end');
    const y1=ly+(s<-0.9?-20:(s>0.9?14:-2));
    const sub=pct?pctText(pct[t]):TYPE[t].verb;
    g+=`<text class="hx-name" x="${lx.toFixed(1)}" y="${y1.toFixed(1)}" text-anchor="${anchor}">${TYPE[t].name}</text><text class="hx-sub" x="${lx.toFixed(1)}" y="${(y1+16).toFixed(1)}" text-anchor="${anchor}"${pct?` data-count="${Math.round(pct[t]*100)}"`:''}>${sub}</text>`;
  });
  const label=pct?'Interest profile: '+ORDER.map(t=>TYPE[t].name+' '+pctText(pct[t])).join(', '):'The six interest types: '+ORDER.map(t=>TYPE[t].name).join(', ');
  return `<svg viewBox="0 0 400 340" role="img" aria-label="${label}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

function animateCounts(){
  if(reducedMotion())return;
  document.querySelectorAll('[data-count]').forEach((el,k)=>{
    const end=+el.dataset.count,t0=performance.now()+150+k*45,dur=900;
    el.textContent='0%';
    const tick=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);el.textContent=Math.round(end*e)+'%';if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
}

    [1/3,2/3,1].forEach(s=>{g.beginPath();ORDER.forEach((t,k)=>{const p=P(k,s);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.closePath();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;g.stroke();});
    ORDER.forEach((t,k)=>{const p=P(k,1);g.beginPath();g.moveTo(cx,cy);g.lineTo(p[0],p[1]);g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;g.stroke();});
    g.beginPath();ORDER.forEach((t,k)=>{const p=P(k,Math.max(r.pct[t],0.05));k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.closePath();

function buildRequest(fd,files){

  const lines=['Educator Hub request '+id,'Name: '+g('name'),'School: '+(g('school')||'-'),'Board: '+(g('board')||'-')+' | Class: '+(g('cls')||'-')+' | Subject: '+(g('subject')||'-'),'Request: '+g('type'),'Plan: '+(g('plan')||'-'),'Details: '+g('details'),'Needed by: '+(g('due')||'-'),'Format: '+(g('format')||'Any')+' | Language: '+(g('lang')||'English'),'Email: '+g('email'),'Phone or WhatsApp: '+(g('phone')||'-'),'Files: '+(files.length?files.map(f=>f.name).join(', '):'none'),'Documents link: '+(g('doclink')||'-'),'Consent to terms and storage: '+(fd.get('consent')?'Yes':'No')];
  const data={id,name:g('name'),school:g('school'),board:g('board'),cls:g('cls'),subject:g('subject'),type:g('type'),plan:g('plan'),details:g('details'),due:g('due'),format:g('format'),lang:g('lang'),email:g('email'),phone:g('phone'),consent:!!fd.get('consent'),doclink:g('doclink'),hp:g('website'),text:lines.join('\n')};
  return {id,text:lines.join('\n'),data};
}

/* Conservative limits, because the files are sent through a Google Apps Script web app. */
const UP={maxFiles:5,maxEach:4*1024*1024,maxTotal:8*1024*1024,ext:['pdf','doc','docx','ppt','pptx','xls','xlsx','csv','txt','jpg','jpeg','png']};
const fmtSize=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
function checkFiles(files){
  const errs=[];let total=0;
  if(files.length>UP.maxFiles)errs.push('Please attach at most '+UP.maxFiles+' files.');
  files.forEach(f=>{
    const ext=(String(f.name).split('.').pop()||'').toLowerCase();
    if(!UP.ext.includes(ext))errs.push(f.name+': this file type is not allowed.');
    if(f.size>UP.maxEach)errs.push(f.name+' is larger than '+fmtSize(UP.maxEach)+'.');
    total+=f.size;
  });
  if(total>UP.maxTotal)errs.push('The files together are larger than '+fmtSize(UP.maxTotal)+'.');
  return errs;
}
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name,type:f.type||'application/octet-stream',data:String(r.result).split(',')[1]||''});r.onerror=()=>rej(r.error);r.readAsDataURL(f);});

function budgetSelect(){
  const bud=[[0,'Show everything'],[20,'Up to ₹20 lakh a year'],[30,'Up to ₹30 lakh a year'],[45,'Up to ₹45 lakh a year'],[60,'Up to ₹60 lakh a year'],[100,'Up to ₹1 crore a year']].map(o=>`<option value="${o[0]}"${state.abroadBudget===o[0]?' selected':''}>${o[1]}</option>`).join('');
  return `<label class="f">My yearly budget <select id="ab-budget">${bud}</select></label>`;
}
function abroadPick(){
  const cty=c=>`<button type="button" class="cty" data-act="ab-pick" data-id="${c.id}"><span class="flag" aria-hidden="true">${c.flag}</span><strong>${c.name}</strong><span class="hint">${c.known}</span></button>`;
  return `<div class="thead">${crumb('Student Hub','Study Abroad')}
    <h1>Study abroad</h1>
    <p class="lead">Choose a country. You will see the opportunities there, the entrance exams you may need and what it costs, one step at a time.</p></div>
  <section class="block" style="margin-top:1.4rem"><h2>Which country?</h2>
    <div class="ctys">${ABROAD.map(cty).join('')}</div>
    <p class="hint" style="margin-top:1rem">Not sure yet? <button type="button" class="linkbtn" data-act="ab-compare">Compare countries by budget</button></p></section>
  <section class="block"><h2>Good to know first</h2>
    <div class="how">
      <details><summary>Your plan, step by step</summary>${AB_STEPS}</details>
      <details><summary>Before you decide</summary><ul>
        <li>Visa rules, fees and work rights change quickly, and several countries tightened them in 2025 and 2026. Always confirm on the official site of the country and the university.</li>
        <li>Use only official university websites to apply. Be careful with agents who promise a visa or a seat, or who ask for money to a personal account.</li>
        <li>If you want to practise medicine in India after studying abroad, check the National Medical Commission rules first.</li>
        <li>Check that the degree is recognised in India if you may return, for example by the Association of Indian Universities.</li></ul></details>
    </div></section>
  ${brandFoot()}
  ${abDisclaimer}`;
}
function abroadCompare(){
  return `<div class="thead">${crumb('Student Hub','Study Abroad','Compare by budget')}

    <p class="lead">Yearly tuition and living costs, with the approximate value in rupees. Choose a budget to see which countries fit.</p>
    <p class="links noprint" style="margin-top:1rem"><button type="button" class="btn ghost small" data-act="ab-back">← All countries</button> ${budgetSelect()}</p></div>

function oppPanel(c){
  return `<div class="pgrid"><div><h3>Why students choose ${c.name}</h3><ul>${li(c.opp)}</ul></div>
    <div><h3>Working after study</h3><p>${c.work}</p></div></div>
    <div class="c-wide c-note" style="margin-top:1.2rem"><h4>Recent changes to watch</h4><ul>${li(c.watch)}</ul></div>
    <p class="links noprint" style="margin-top:1.2rem"><button type="button" class="btn" data-act="ab-tab" data-tab="exams">Next: entrance exams</button></p>`;
}
function examsPanel(c){
  const cards=ABROAD_TESTS.filter(x=>c.testIds.includes(x.id)).map(x=>`<div class="tsvc"><h3>${x.t}</h3><p>${x.d}</p><p><strong>${x.c}</strong></p><p class="hint">${x.n}</p></div>`).join('');
  return `<h3>How to apply and what you may need</h3><ul>${li(c.tests)}</ul><p class="hint">${c.entry}</p>
    <h3>Test details and fees in India</h3><div class="tgrid">${cards}</div>
    <p class="hint" style="margin-top:.8rem">Which tests you need depends on the university and the course, so check each university’s page.</p>
    <p class="links noprint" style="margin-top:1.2rem"><button type="button" class="btn" data-act="ab-tab" data-tab="money">Next: money</button></p>`;
}
function moneyPanel(c){
  const mn=lakhNum(c.cur,c.tuition[0]+c.living[0]),mx=lakhNum(c.cur,c.tuition[1]+c.living[1]),b=state.abroadBudget;
  const fitTag=!b?'':mx<=b?'<span class="st st-open">Fits your budget</span>':mn<=b?'<span class="st st-soon">Possible at the lower end</span>':'<span class="st st-closed">Above your budget</span>';
  return `<div class="filters noprint">${budgetSelect()} ${fitTag}</div>
    <h3>What it costs each year</h3>
    <div class="costgrid">
      <div class="cost"><span class="hint">Tuition</span><b>${money(c.cur,c.tuition[0])}–${money(c.cur,c.tuition[1])}</b><span class="hint">${lakhRange(c.cur,c.tuition[0],c.tuition[1])}</span></div>
      <div class="cost"><span class="hint">Living</span><b>${money(c.cur,c.living[0])}–${money(c.cur,c.living[1])}</b><span class="hint">${lakhRange(c.cur,c.living[0],c.living[1])}</span></div>
      <div class="cost total"><span class="hint">Total a year, about</span><b>₹${lf(mn)}–${lf(mx)} lakh</b><span class="hint">Most bachelor’s degrees take 3–4 years</span></div>
    </div>
    <ul style="margin-top:1rem"><li>${c.tuitionNote}</li><li>${c.livingNote}</li></ul>
    <h3>Visa and proof of funds</h3><p>${c.visaNote}</p>
    <h3>Scholarships</h3><ul>${li(c.scholarships)}</ul>
    <h3>Paying for it</h3><ul>
      <li>Many Indian banks and finance companies offer education loans for study abroad. Ask early about the amount, security needed, interest and repayment.</li>
      <li>Add extra costs: flights, health insurance, visa and application fees, test fees, deposits and winter clothes.</li>
      <li>Part-time work can help with daily expenses but will not pay tuition.</li>
      <li>Rupee values use US$1 ≈ ₹${FX.USD}, £1 ≈ ₹${FX.GBP}, €1 ≈ ₹${FX.EUR}, CA$1 ≈ ₹${FX.CAD}, A$1 ≈ ₹${FX.AUD}, NZ$1 ≈ ₹${FX.NZD}, S$1 ≈ ₹${FX.SGD} and AED 1 ≈ ₹${FX.AED} (22–23 October 2026). Rates change daily.</li></ul>`;
}
function countryBody(){
  const c=ABROAD.find(x=>x.id===state.abId),tab=state.abTab;
  const tabs=AB_TABS.map(t=>`<button type="button" role="tab" id="ab-tab-${t[0]}" class="tab" aria-selected="${tab===t[0]}" data-act="ab-tab" data-tab="${t[0]}">${t[1]}</button>`).join('');
  const panel=tab==='exams'?examsPanel(c):tab==='money'?moneyPanel(c):oppPanel(c);
  return `<div class="tabs noprint" role="tablist" aria-label="${c.name}">${tabs}</div>
    <div class="tabpanel" role="tabpanel" aria-labelledby="ab-tab-${tab}"><p class="print-only"><strong>${AB_TABS.find(t=>t[0]===tab)[1]}</strong></p>${panel}</div>
    <p class="links noprint" style="margin-top:1.4rem"><strong>Official sources:</strong> ${c.sources.map(s=>extLink(s[1],s[0],'ghost')).join(' ')}</p>`;
}
function abroadCountry(){
  const c=ABROAD.find(x=>x.id===state.abId);
  const sw=ABROAD.map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${x.flag} ${x.name}</option>`).join('');
  return `<div class="thead">${crumb('Student Hub','Study Abroad',c.name)}
    <h1>${c.flag} ${c.name}</h1>
    <p class="links noprint" style="margin-top:1rem"><button type="button" class="btn ghost small" data-act="ab-back">← All countries</button> <label class="f">Switch country <select id="ab-switch">${sw}</select></label> <button type="button" class="btn ghost small" data-act="print">Print or save as PDF</button></p></div>
  <div id="ab-view">${countryBody()}</div>
  ${brandFoot()}
  ${abDisclaimer}`;
}
function abroad(){
  if(state.abMode==='country'&&ABROAD.find(c=>c.id===state.abId))return abroadCountry();
  if(state.abMode==='compare')return abroadCompare();
  return abroadPick();
}
function refreshAb(){
  const v=document.getElementById('ab-view');
  if(v){v.innerHTML=countryBody();const t=document.getElementById('ab-tab-'+state.abTab);if(t)t.focus({preventScroll:true});}
}

  else if(act==='ex-tab'){state.exTab=b.dataset.tab;if(state.exTab==='practice')prEnter();refreshEx('#ex-tab-'+state.exTab);}
  else if(act==='cu-toggle'){
    const id=b.dataset.id,i=state.cuet.indexOf(id);state.cuMsg='';

    else if(state.cuet.length>=CU_MAX)state.cuMsg='You can choose at most '+CU_MAX+' papers in all. Remove one to add another.';
    else state.cuet.push(id);
    refreshEx('[data-act="cu-toggle"][data-id="'+id+'"]');
  }
  else if(act==='cu-area'){state.cuF=b.dataset.id;refreshEx('[data-act="cu-area"][data-id="'+state.cuF+'"]');}
  else if(act==='cu-example'){state.cuet=CU_EXAMPLES[parseInt(b.dataset.id,10)][1].slice();state.cuMsg='';refreshEx('[data-act="cu-example"][data-id="'+b.dataset.id+'"]');}
  else if(act==='cu-clear'){state.cuet=[];state.cuMsg='';refreshEx('[data-act="cu-clear"]');}
  else if(act==='pr-open'&&authOn()&&!PR.user){authOpen('practice');}
  else if(act==='pr-open'){state.exMode='exam';state.exId='npat';state.exTab='practice';state.exGoal='';prEnter();if(state.view!=='exams')go('exams');else{render();exFocusTop();}}
  else if(act.indexOf('au-')===0){auAction(act,b);}
  else if(act.indexOf('pr-')===0){prAction(act,b);}
  else return false;
  return true;
}

/* ---------- NPAT QUESTION BANK ---------- */
/* ---------- NPAT PRACTICE BANK ----------
   Original questions written for Ascend Hub. No past-paper questions are copied.
   Maths and reasoning questions are GENERATED from a seed, so every attempt is different, and each answer is computed by the code.
   English questions are written by hand (a fixed set).
   Every question: {id, sec, topic, diff, q, passage?, opts[4], ans (0-3), exp, meta?}
   sec: 'qa' Quantitative and Numerical Ability, 'ri' Reasoning and General Intelligence, 'en' Proficiency in English. diff: 1 easy, 2 medium, 3 hard. */
const NPAT=(function(){
  const SECS={qa:'Quantitative and Numerical Ability',ri:'Reasoning and General Intelligence',en:'Proficiency in English'};
  function rng(seed){let a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
  const pick=(r,a)=>a[Math.floor(r()*a.length)];
  function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

  const QA_IDS=Object.keys(QA),RI_IDS=Object.keys(RI);
  const TOPICS={qa:[...new Set(QA_IDS.map(k=>QA[k].topic))],ri:[...new Set(RI_IDS.map(k=>RI[k].topic).concat(RI_STATIC.map(x=>x[0])))],en:[...new Set(EN.map(x=>x[0]))]};
  function fixed(arr,sec,i,seed){const x=arr[i];const q=mk(rng(seed),{sec,topic:x[0],diff:x[1],q:x[2],correct:x[3],wrong:x[4],exp:x[5],passage:x[6]});q.id=sec+'-f'+i+'-'+seed;return q;}
  function gen(map,sec,key,seed){const r=rng(seed);const q=map[key].f(r);q.id=sec+'-'+key+'-'+seed;return q;}
  /* Rebuild a question from its id, so a saved attempt can be reviewed. */
  function fromId(id){const p=String(id).split('-'),sec=p[0];if(/^f\d+$/.test(p[1]||'')){return fixed(sec==='ri'?RI_STATIC:EN,sec,parseInt(p[1].slice(1),10),parseInt(p[2],10));}

  /* spec: {sec:'qa'|'ri'|'en', topic?:string, diff?:1|2|3, count:int, seed:int}. Returns unique questions. */
  function build(spec){
    const r=rng(spec.seed||1),out=[],seen=new Set();let guard=0;
    const sec=spec.sec;
    const fixedPool=sec==='en'?EN.map((x,i)=>i):sec==='ri'?RI_STATIC.map((x,i)=>i):[];
    const arr=sec==='en'?EN:RI_STATIC;
    const genMap=sec==='qa'?QA:sec==='ri'?RI:null;
    let genKeys=genMap?Object.keys(genMap):[];
    if(spec.topic){genKeys=genKeys.filter(k=>genMap[k].topic===spec.topic);}
    let fixedIdx=fixedPool.filter(i=>!spec.topic||arr[i][0]===spec.topic);
    if(spec.diff){fixedIdx=fixedIdx.filter(i=>arr[i][1]===spec.diff);if(genMap)genKeys=genKeys.filter(k=>genMap[k].diff===spec.diff||k==='series');}
    const fixedOrder=shuffle(r,fixedIdx);let fp=0;
    /* mix: fixed questions are used for about 25% of reasoning questions, and for all English questions */
    while(out.length<spec.count&&guard++<spec.count*40){
      let q=null;
      if(sec==='en'){if(fp>=fixedOrder.length)break;q=fixed(EN,'en',fixedOrder[fp++],Math.floor(r()*1e9)+1);}
      else{
        const useFixed=sec==='ri'&&fixedOrder.length>fp&&(!genKeys.length||r()<0.25);
        if(useFixed)q=fixed(RI_STATIC,'ri',fixedOrder[fp++],Math.floor(r()*1e9)+1);

        else break;
      }
      if(!q)continue;
      const sig=q.q+'|'+(q.passage||'');
      if(seen.has(sig))continue;seen.add(sig);out.push(q);
    }
    return out;
  }

  function mock(perSection,seed){
    const r=rng(seed);
    return ['qa','ri','en'].reduce((all,sec)=>all.concat(build({sec,count:perSection,seed:Math.floor(r()*1e9)+1})),[]);
  }
  function weakSet(weak,count,seed){ /* weak: [{sec,topic}] */
    const r=rng(seed);const out=[];const per=Math.max(1,Math.ceil(count/weak.length));
    weak.forEach(w=>{build({sec:w.sec,topic:w.topic,count:per,seed:Math.floor(r()*1e9)+1}).forEach(q=>out.push(q));});

/* ----- server calls ----- */
async function prApi(body){
  if(!PRACTICE.endpoint)return{ok:false,error:'off'};
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);
  try{
    const r=await fetch(PRACTICE.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac.signal});
    return await r.json();
  }catch(e){return{ok:false,error:'net'};}
  finally{clearTimeout(t);}
}

async function prFlushPending(){
  if(!PR.user)return;
  const q=prJson(PR_PENDING,[]);if(!q.length)return;
  const keep=[];
  for(const a of q){const r=await prApi({action:'save',token:PR.user.token,attempt:a});if(!r.ok&&r.error!=='data')keep.push(a);else if(r.ok&&!PR.attempts.some(x=>x.id===a.id))PR.attempts.unshift(a);}
  prLsSet(PR_PENDING,JSON.stringify(keep));prRefresh();
}

function prAgg(list){
  const sec={qa:[0,0],ri:[0,0],en:[0,0]},top={};let n=0,c=0;
  list.forEach(a=>{
    n+=a.total;c+=a.correct;
    ['qa','ri','en'].forEach(s=>{const p=(a.bySec||{})[s];if(p){sec[s][0]+=p[0];sec[s][1]+=p[1];}});
    Object.keys(a.byTopic||{}).forEach(k=>{const p=a.byTopic[k];if(!top[k])top[k]=[0,0];top[k][0]+=p[0];top[k][1]+=p[1];});
  });
  return{n,c,sec,top};
}
function prWeak(list){
  const g=prAgg(list||prList());

/* ----- running a test ----- */
function prStart(mode){
  const seed=prSeed(),c=PR.cfg;let qs=[],limit=0;PR.msg='';PR.notice='';
  if(mode==='mock'){qs=NPAT.mock(40,seed);limit=PRACTICE.mockMin*60;}
  else if(mode==='mini'){qs=NPAT.mock(10,seed);limit=PRACTICE.miniMin*60;}
  else if(mode==='revise'){const w=prWeak();if(!w.length)return;qs=NPAT.weakSet(w.map(t=>({sec:PR_TOPIC_SEC[t],topic:t})),20,seed);}
  else{
    const secs=c.sec==='all'?['qa','ri','en']:[c.sec],per=Math.ceil(c.count/secs.length);
    secs.forEach(s=>{qs=qs.concat(NPAT.build({sec:s,topic:secs.length===1&&c.topic?c.topic:undefined,diff:c.diff||undefined,count:per,seed:seed+s.charCodeAt(0)}));});
    qs=prShuffle(qs).slice(0,c.count);
  }
  if(!qs.length){PR.msg='We could not find questions for that choice. Try another level or topic.';prRefresh();return;}
  PR.run={mode,qs,i:0,ans:qs.map(()=>-1),mark:qs.map(()=>false),shown:qs.map(()=>false),start:Date.now(),limit,id:prId(),live:''};
  PR.screen='run';PR.confirmSubmit=false;PR.res=null;
  clearInterval(PR.timer);
  if(limit)PR.timer=setInterval(prTick,1000);
  prRefresh('#pr-qtext');window.scrollTo(0,0);
}
function prTick(){
  const r=PR.run;
  if(!r||!r.limit){clearInterval(PR.timer);return;}
  const left=r.limit-(Date.now()-r.start)/1000,el=document.getElementById('pr-timer');
  if(el)el.textContent=prMMSS(left);
  [600,300,60].forEach(s=>{if(left<=s&&!r['w'+s]){r['w'+s]=true;const lv=document.getElementById('pr-live');if(lv)lv.textContent=Math.round(s/60)+(s===60?' minute':' minutes')+' left.';}});
  if(left<=0)prFinish(true);
}
const prFeedback=r=>r.mode==='practice'||r.mode==='revise';
function prOptsHTML(q,sel,reveal){
  return q.opts.map((o,k)=>{
    let cls='optbtn',tag='';
    if(reveal){if(k===q.ans){cls+=' ok';tag='<span class="pr-tag">✓ Correct answer</span>';}else if(k===sel){cls+=' no';tag='<span class="pr-tag">✗ Your answer</span>';}}
    return `<button type="button" class="${cls}" data-act="pr-opt" data-k="${k}" aria-pressed="${sel===k}"${reveal?' disabled':''}><b aria-hidden="true">${'ABCD'[k]}</b><span>${esc(o)}${tag?' '+tag:''}</span></button>`;
  }).join('');
}
function prRunHTML(){
  const r=PR.run,q=r.qs[r.i],n=r.qs.length,fb=prFeedback(r),sel=r.ans[r.i],reveal=fb&&(sel>=0||r.shown[r.i]);
  const answered=r.ans.filter(x=>x>=0).length,marked=r.mark.filter(Boolean).length;
  const head=`<div class="pr-top"><p><strong>${PR_MODE_NAME[r.mode]}</strong> · Question ${r.i+1} of ${n} · ${esc(NPAT.SECS[q.sec])}${q.topic?' · '+esc(q.topic):''}</p>${r.limit?`<p class="prtimer">Time left <span id="pr-timer" role="timer">${prMMSS(r.limit-(Date.now()-r.start)/1000)}</span></p>`:''}</div><div class="sr-only" id="pr-live" aria-live="polite"></div><p class="bar" aria-hidden="true"><span style="width:${prPct(r.i+1,n)}%"></span></p>`;
  const qh=`${q.passage?`<div class="prpass"><strong>Read the passage, then answer.</strong><p>${esc(q.passage)}</p></div>`:''}<p class="prq" id="pr-qtext" tabindex="-1">${esc(q.q)}</p><div class="pro" role="group" aria-labelledby="pr-qtext">${prOptsHTML(q,sel,reveal)}</div>`;
  const exp=reveal?`<div class="prexp" role="status"><strong>${sel<0?'Here is the answer.':sel===q.ans?'Right.':'Not this time.'}</strong> ${esc(q.exp)}</div>`:'';
  const showBtn=fb&&!reveal?`<p><button type="button" class="btn ghost" data-act="pr-show">Show answer and solution</button></p>`:'';
  const nav=`${showBtn}<p class="links"><button type="button" class="btn ghost" data-act="pr-prev"${r.i===0?' disabled':''}>← Previous</button> ${fb?'':`<button type="button" class="btn ghost" data-act="pr-mark" aria-pressed="${r.mark[r.i]}">${r.mark[r.i]?'Unmark':'Mark for review'}</button> `}${r.i<n-1?`<button type="button" class="btn" data-act="pr-next">${fb&&!reveal?'Skip':'Next'} →</button>`:''} <button type="button" class="btn ${r.i===n-1?'':'ghost'}" data-act="pr-submit">${fb?'Finish and see score':'Submit test'}</button></p>`;
  let confirm='';
  if(PR.confirmSubmit)confirm=`<div class="alert" role="alertdialog" aria-label="Confirm"><strong>${fb?'Finish this session?':'Submit your test?'}</strong> You answered ${answered} of ${n}.${marked?' '+marked+' marked for review.':''}${!fb&&answered<n?' Unanswered questions score zero.':''} <button type="button" class="btn small" data-act="pr-submit-yes">Yes, ${fb?'finish':'submit'}</button> <button type="button" class="btn ghost small" data-act="pr-submit-no">Keep going</button></div>`;
  let pal='';
  if(!fb){
    const parts=['qa','ri','en'].map(s=>{const idx=r.qs.map((x,k)=>x.sec===s?k:-1).filter(k=>k>=0);if(!idx.length)return '';return `<p class="pr-pal-h">${esc(NPAT.SECS[s])}</p><div class="palette">${idx.map(k=>`<button type="button" class="pal${r.ans[k]>=0?' ans':''}${r.mark[k]?' mk':''}${k===r.i?' cur':''}" data-act="pr-go" data-i="${k}" aria-label="Question ${k+1}, ${r.ans[k]>=0?'answered':'not answered'}${r.mark[k]?', marked for review':''}"${k===r.i?' aria-current="true"':''}>${k+1}</button>`).join('')}</div>`;}).join('');
    pal=`<details class="pr-pal"${n<=30?' open':''}><summary>Question palette · ${answered} answered${marked?' · '+marked+' marked':''}</summary>${parts}<p class="hint">Filled = answered. Dashed = marked for review.</p></details>`;
  }
  return `${head}${qh}${exp}${nav}${confirm}${pal}`;
}
function prOpt(k){
  const r=PR.run;if(!r)return;
  if(prFeedback(r)&&(r.ans[r.i]>=0||r.shown[r.i]))return;
  r.ans[r.i]=r.ans[r.i]===k&&!prFeedback(r)?-1:k;
  prRefresh(prFeedback(r)?'[data-act="pr-next"],[data-act="pr-submit"]':'[data-act="pr-opt"][data-k="'+k+'"]');
}
function prGo(i){const r=PR.run;if(!r||i<0||i>=r.qs.length)return;r.i=i;PR.confirmSubmit=false;prRefresh('#pr-qtext');const q=document.getElementById('pr-qtext');if(q)q.scrollIntoView({block:'nearest'});}

function prFinish(auto){
  const r=PR.run;if(!r)return;
  clearInterval(PR.timer);
  const idx=r.qs.map((q,i)=>i).filter(i=>!prFeedback(r)||r.ans[i]>=0||r.shown[i]);
  PR.confirmSubmit=false;
  if(!idx.length){PR.run=null;PR.screen='home';PR.msg='You did not answer any question, so nothing was saved.';prRefresh();return;}
  const bySec={qa:[0,0],ri:[0,0],en:[0,0]},byTopic={};let correct=0;
  idx.forEach(i=>{const q=r.qs[i],ok=r.ans[i]===q.ans;bySec[q.sec][0]++;if(ok){bySec[q.sec][1]++;correct++;}if(!byTopic[q.topic])byTopic[q.topic]=[0,0];byTopic[q.topic][0]++;if(ok)byTopic[q.topic][1]++;});
  const secs=['qa','ri','en'].filter(s=>bySec[s][0]>0);
  const dur=Math.min(20000,Math.round((Date.now()-r.start)/1000));
  const attempt={id:r.id,ts:Date.now(),mode:r.mode,sec:secs.length===1?secs[0]:'all',total:idx.length,correct,durationSec:dur,bySec,byTopic};
  PR.res={attempt,qs:r.qs,ans:r.ans,mark:r.mark,mode:r.mode,auto:!!auto,saveMsg:'',reported:{}};
  PR.run=null;PR.screen='result';PR.revFilter='all';
  prSave(attempt);
  prRefresh('#pr-qtext');window.scrollTo(0,0);
}
async function prSave(a){
  if(!PR.user){
    const L=prLocalAttempts();L.unshift(a);prLsSet(PR_LOCAL,JSON.stringify(L.slice(0,200)));
    if(PR.res)PR.res.saveMsg=prLsGet(PR_LOCAL)?'Saved on this device.':'We could not save this score on your device.';
    return;
  }
  const r=await prApi({action:'save',token:PR.user.token,attempt:a});
  if(r.ok){PR.attempts.unshift(a);if(PR.res)PR.res.saveMsg='Saved to your account.';}
  else if(r.error==='auth'||r.error==='role'){if(r.error==='auth'){prLsDel(PR_SESSION);PR.user=null;prSyncTop();}const L=prLocalAttempts();L.unshift(a);prLsSet(PR_LOCAL,JSON.stringify(L.slice(0,200)));if(PR.res)PR.res.saveMsg='This score is saved on this device. Please sign in again as a student to keep saving to your account.';}
  else{const q=prJson(PR_PENDING,[]);q.push(a);prLsSet(PR_PENDING,JSON.stringify(q.slice(-30)));if(PR.res)PR.res.saveMsg='We could not reach the server. We will try again next time you open this page signed in.';}
  prRefresh();
}

/* ----- results and review ----- */
function prResultHTML(){
  const R=PR.res,a=R.attempt,v=prPct(a.correct,a.total);
  const real=R.mode==='mock'?'':'';
  const secRows=['qa','ri','en'].filter(s=>a.bySec[s][0]>0).map(s=>{const p=a.bySec[s],x=prPct(p[1],p[0]);return `<li><span class="pr-lab">${NPAT.SECS[s]}</span><span class="bar" aria-hidden="true"><span style="width:${x}%"></span></span><span class="pr-val">${p[1]} of ${p[0]} (${x}%)</span></li>`;}).join('');
  const topRows=Object.keys(a.byTopic).sort((x,y)=>prPct(a.byTopic[x][1],a.byTopic[x][0])-prPct(a.byTopic[y][1],a.byTopic[y][0])).map(k=>{const p=a.byTopic[k],x=prPct(p[1],p[0]);return `<li><span class="pr-lab">${esc(k)}</span><span class="bar" aria-hidden="true"><span style="width:${x}%"></span></span><span class="pr-val">${p[1]} of ${p[0]}</span></li>`;}).join('');
  const sk=R.qs.filter((q,i)=>R.ans[i]<0).length;
  return `<h3 id="pr-qtext" tabindex="-1">Your result</h3>${R.auto?'<p class="pr-msg" role="status">Time was up, so your test was submitted for you.</p>':''}
  <div class="prstats"><div class="prstat"><b>${a.correct} / ${a.total}</b><span>marks (1 for each right answer)</span></div><div class="prstat"><b>${v}%</b><span>correct</span></div><div class="prstat"><b>${prDur(a.durationSec)}</b><span>time taken</span></div></div>
  ${R.mode==='mock'||R.mode==='mini'?`<p>${sk?sk+' question'+(sk===1?' was':'s were')+' left unanswered. ':''}This is practice. Your score on a real NPAT depends on that paper, so use it to find what to work on.</p>`:''}
  <p class="hint" role="status">${esc(R.saveMsg)}</p>
  <h3>By section</h3><ul class="prrows">${secRows}</ul><h3>By topic, weakest first</h3><ul class="prrows">${topRows}</ul>
  <p class="links"><button type="button" class="btn" data-act="pr-review">Review answers and working</button> <button type="button" class="btn ghost" data-act="pr-home">Back to my practice page</button></p>`;
}
function prReviewHTML(){
  const R=PR.res,f=PR.revFilter;
  const items=R.qs.map((q,i)=>({q,i,s:R.ans[i]})).filter(x=>f==='all'||(f==='wrong'&&x.s>=0&&x.s!==x.q.ans)||(f==='skipped'&&x.s<0));
  const filt=[['all','All'],['wrong','Wrong'],['skipped','Not answered']].map(o=>`<button type="button" class="chipbtn" data-act="pr-filter" data-f="${o[0]}" aria-pressed="${f===o[0]}">${o[1]}</button>`).join(' ');
  const rows=items.map(x=>{
    const q=x.q,st=x.s<0?'Not answered':x.s===q.ans?'Right':'Wrong';
    const rep=PR.res.reported[q.id]?'<span class="hint">Thank you, we will check this question.</span>':(PR.user?`<button type="button" class="linkbtn" data-act="pr-report" data-i="${x.i}">Report a mistake</button>`:`<a class="linkbtn" href="mailto:${PRACTICE.support}?subject=${encodeURIComponent('Ascend Hub practice: question '+q.id)}&body=${encodeURIComponent('Question id: '+q.id+'\n\nWhat looks wrong:\n')}">Report a mistake</a>`);
    return `<li class="pr-rev"><p class="pr-rev-h"><strong>Question ${x.i+1}</strong> · ${esc(NPAT.SECS[q.sec])} · ${esc(q.topic)} · <strong>${st}</strong></p>${q.passage?`<details><summary>Show the passage</summary><div class="prpass"><p>${esc(q.passage)}</p></div></details>`:''}<p class="prq">${esc(q.q)}</p><div class="pro">${q.opts.map((o,k)=>{let cls='optbtn',tag='';if(k===q.ans){cls+=' ok';tag=' ✓ Correct answer';}else if(k===x.s){cls+=' no';tag=' ✗ Your answer';}return `<div class="${cls}"><b aria-hidden="true">${'ABCD'[k]}</b><span>${esc(o)}${tag}</span></div>`;}).join('')}</div><div class="prexp"><strong>Working:</strong> ${esc(q.exp)}</div><p>${rep}</p></li>`;
  }).join('');
  return `<h3 id="pr-qtext" tabindex="-1">Review</h3><p class="links noprint">${filt}</p><ol class="prrev">${rows||'<li>Nothing to show here.</li>'}</ol><p class="links"><button type="button" class="btn" data-act="pr-result">Back to result</button> <button type="button" class="btn ghost" data-act="pr-home">My practice page</button></p>`;
}

/* ----- clicks and changes ----- */
function prChange(t){
  const c=PR.cfg;
  if(t.id==='pr-sec'){c.sec=t.value;c.topic='';}
  else if(t.id==='pr-topic')c.topic=t.value;
  else if(t.id==='pr-diff')c.diff=parseInt(t.value,10)||0;
  else if(t.id==='pr-count')c.count=parseInt(t.value,10)||10;
  PR.msg='';
  if(t.id==='pr-sec')prRefresh('#pr-sec');
}
async function prAction(act,b){
  switch(act){
    case 'pr-open':break;
    case 'pr-start':prStart(b.dataset.mode);break;
    case 'pr-opt':prOpt(parseInt(b.dataset.k,10));break;
    case 'pr-next':if(PR.run)prGo(PR.run.i+1);break;
    case 'pr-prev':if(PR.run)prGo(PR.run.i-1);break;
    case 'pr-go':prGo(parseInt(b.dataset.i,10));break;
    case 'pr-mark':if(PR.run){PR.run.mark[PR.run.i]=!PR.run.mark[PR.run.i];prRefresh('[data-act="pr-mark"]');}break;
    case 'pr-show':if(PR.run){PR.run.shown[PR.run.i]=true;prRefresh('[data-act="pr-next"],[data-act="pr-submit"]');}break;
    case 'pr-resume':if(PR.run){PR.screen='run';prRefresh('#pr-qtext');}break;
    case 'pr-finish-now':prFinish(false);break;
    case 'pr-discard':PR.confirmDiscard=true;prRefresh('[data-act="pr-discard-yes"]');break;
    case 'pr-discard-no':PR.confirmDiscard=false;prRefresh('[data-act="pr-discard"]');break;
    case 'pr-discard-yes':clearInterval(PR.timer);PR.run=null;PR.confirmDiscard=false;PR.screen='home';prRefresh('#pr-root h3');break;
    case 'pr-submit':PR.confirmSubmit=true;prRefresh('[data-act="pr-submit-yes"]');break;
    case 'pr-submit-no':PR.confirmSubmit=false;prRefresh('[data-act="pr-submit"]');break;
    case 'pr-submit-yes':prFinish(false);break;
    case 'pr-review':PR.screen='review';prRefresh('#pr-qtext');window.scrollTo(0,0);break;
    case 'pr-result':PR.screen='result';prRefresh('#pr-qtext');window.scrollTo(0,0);break;
    case 'pr-home':PR.screen='home';PR.msg='';prRefresh('#pr-root h3');window.scrollTo(0,0);break;
    case 'pr-filter':PR.revFilter=b.dataset.f;prRefresh('[data-act="pr-filter"][data-f="'+b.dataset.f+'"]');break;
    case 'pr-clear-local':prLsDel(PR_LOCAL);PR.notice='Scores on this device were cleared.';prRefresh('#pr-root h3');break;
    case 'pr-report':{
      const i=parseInt(b.dataset.i,10),q=PR.res&&PR.res.qs[i];if(!q||!PR.user)break;
      const r=await prApi({action:'report',token:PR.user.token,questionId:q.id,message:'Reported from review'});
      if(r.ok){PR.res.reported[q.id]=true;prRefresh();}
      else{b.textContent='Could not send. Try again.';}
      break;}
  }
}

function authAfter(){
  const a=AU.after;AU.after=null;AU.step='start';AU.code='';AU.msg='';AU.info='';
  const r=PR.user.role;
  if(a&&a.kind&&GATES[a.kind].roles.includes(r)){if(a.view)return go(a.view);return authGoto(a.kind);}
  AU.notice='';
  go(r==='student'?'welcome':r==='teacher'?'teachers':'schools'); /* the person's own section */

/* ----- actions ----- */
async function authLogout(){
  const t=PR.user&&PR.user.token;
  clearInterval(PR.timer);PR.user=null;PR.attempts=[];PR.run=null;PR.res=null;PR.screen='home';prLsDel(PR_SESSION);AU.confirmDel=false;
  prSyncTop();go('welcome');
  if(t)prApi({action:'logout',token:t});
}
async function auAction(act,b){
  const A=AU;
  switch(act){
    case 'au-open':{const k=b.dataset.after||'';A.after=k?{kind:k,view:b.dataset.view||''}:null;A.role=b.dataset.role||(k?GATES[k].def:A.role);A.step='start';A.msg='';A.info='';A.busy=false;go('signin');break;}
    case 'au-role':{A.email=(document.getElementById('au-email')||{}).value||A.email;A.role=b.dataset.r;A.msg='';authRender('[data-act="au-role"][data-r="'+A.role+'"]');break;}
    case 'au-back':A.step='start';A.msg='';A.info='';authRender('#au-email');break;
    case 'au-send':{
      if(A.busy)break;
      A.email=((document.getElementById('au-email')||{}).value||'').trim();
      const agreed=!!(document.getElementById('au-consent')||{}).checked;
      if(!A.role){A.msg='Please choose who you are first.';authRender('[data-act="au-role"]');break;}
      if(!/^\S+@\S+\.\S+$/.test(A.email)){A.msg=PR_ERR.email;authRender('#au-email');break;}
      if(!agreed){A.msg=PR_ERR.consent;authRender('#au-consent');break;}
      A.busy=true;A.msg='';authRender();
      const r=await prApi({action:'requestCode',email:A.email,consent:true});
      A.busy=false;
      if(r.ok){A.step='code';A.code='';A.msg='';A.info=r.repeat?'We sent a code a moment ago. Please use the code from that email.':'';authRender('#au-code');}
      else{A.msg=PR_ERR[r.error]||PR_ERR.server;authRender('#au-email');}
      break;}
    case 'au-verify':{
      if(A.busy)break;
      const code=((document.getElementById('au-code')||{}).value||'').replace(/\D/g,'');
      A.code=code;
      if(code.length!==6){A.msg=PR_ERR.short;authRender('#au-code');break;}
      A.busy=true;A.msg='';authRender();
      const r=await prApi({action:'verifyCode',email:A.email,code,role:A.role});
      A.busy=false;
      if(r.ok){
        PR.user={email:r.email,token:r.token,role:r.role};PR.attempts=[];PR.started=false;authSave();A.code='';
        prSyncTop();authAfter();
      }else{A.msg=PR_ERR[r.error]||PR_ERR.server;authRender('#au-code');}
      break;}
    case 'au-switch':{
      if(!PR.user)break;
      const role=b.dataset.r,after=b.dataset.after||'',view=b.dataset.view||'';
      if(role===PR.user.role){if(view)go(view);else if(after)authGoto(after);else authRender();break;}
      const r=await prApi({action:'setRole',token:PR.user.token,role});
      if(r.ok){
        PR.user.role=r.role;PR.attempts=[];PR.started=false;authSave();AU.notice='Your role is now '+roleName(r.role)+'.';prSyncTop();
        if(after&&GATES[after].roles.includes(r.role)){if(view)go(view);else authGoto(after);}else if(state.view==='account')authRender();else render();
      }else if(r.error==='auth'){PR.user=null;prLsDel(PR_SESSION);prSyncTop();AU.after=after?{kind:after,view}:null;go('signin');}
      else{AU.notice=PR_ERR[r.error]||PR_ERR.server;authRender();}
      break;}
    case 'au-account':go('account');break;
    case 'au-goto':authGoto(b.dataset.k);break;
    case 'au-logout':authLogout();break;
    case 'au-del':A.confirmDel=true;authRender('[data-act="au-del-yes"]');break;
    case 'au-del-no':A.confirmDel=false;authRender('[data-act="au-del"]');break;
    case 'au-del-yes':{
      const t=PR.user&&PR.user.token;if(!t)break;
      const r=await prApi({action:'deleteMe',token:t});
      A.confirmDel=false;
      if(r.ok||r.error==='auth'){clearInterval(PR.timer);PR.user=null;PR.attempts=[];PR.run=null;PR.res=null;PR.screen='home';prLsDel(PR_SESSION);prLsDel(PR_PENDING);AU.notice='';prSyncTop();go('welcome');}
      else{A.notice='We could not delete your data right now. Please try again, or write to '+PRACTICE.support+'.';authRender();}
      break;}
  }
}

function authNav(){

  set('menu-student',!on||canUse('student'));set('nav-teachers',!on||canUse('teachers'));set('nav-schools',!on||canUse('school'));

function prSyncTop(){
  authNav();
  const b=document.getElementById('nav-signin'),bar=document.getElementById('topbar');if(!b||!bar)return;
  bar.hidden=!authOn();
  if(!authOn())return;
  if(PR.user){const nm=PR.user.email.split('@')[0],s=nm.length>12?nm.slice(0,11)+'…':nm;b.textContent='✓ '+s;b.setAttribute('aria-label','Signed in as '+PR.user.email+', '+roleName(PR.user.role)+'. Open my account.');b.title=PR.user.email+' ('+roleName(PR.user.role)+')';}
  else{b.textContent='Sign in';b.setAttribute('aria-label','Sign in');b.removeAttribute('title');}
}
function prTop(){if(PR.user)go('account');else{AU.after=null;AU.role='';AU.step='start';AU.msg='';AU.info='';AU.busy=false;go('signin');}}
async function prBoot(){
  const s=prJson(PR_SESSION,null);
  if(authOn()&&s&&s.token&&s.email&&ROLES[s.role])PR.user={email:s.email,token:s.token,role:s.role};
  const tb=document.getElementById('nav-signin');if(tb)tb.addEventListener('click',prTop);
  prSyncTop();
  if(PR.user){
    const r=await prApi({action:'whoami',token:PR.user.token});
    let changed=false;
    if(r.ok&&r.role!==PR.user.role){PR.user.role=r.role;authSave();changed=true;}
    else if(!r.ok&&r.error==='auth'){PR.user=null;prLsDel(PR_SESSION);changed=true;}
    prSyncTop();
    if(changed&&!PR.run)render();
  }
}

/* ---------- QUIZ COUNTS AND OPTIONAL RESULT SHARING ---------- */
/* Anonymous counts: only class, subject group, top interests and scores are sent. No name or contact details.
   Students can also choose to share their result with their name and contact, with consent. Both need CONTACT.endpoint. */
const newAttemptId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const groupLabel=()=>state.level==='after10'?'Class 10':(STREAMS[state.stream]||{label:'Not sure yet'}).label;
const levelLabel=()=>state.level==='after10'?'Class 10':'Class 11 or 12';
function quizSummary(){
  const r=state.result,top=r.ranked.slice(0,3),pct={};
  ORDER.forEach(t=>{pct[t]=Math.round(r.pct[t]*100);});
  const best=state.level==='after10'?r.paths.slice(0,3).map(x=>x.p.title).join('; '):filtered().slice(0,5).map(x=>x.c.title).join('; ');
  return {level:levelLabel(),group:groupLabel(),top:top.map(t=>TYPE[t].name),pct,scoresText:ORDER.map(t=>TYPE[t].name+' '+pct[t]+'%').join(', '),best};
}
function sendToScript(payload){
  if(!CONTACT.endpoint)return Promise.resolve(false);
  return fetch(CONTACT.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>true);
}
function trackQuiz(stage){
  if(!CONTACT.endpoint||!state.attemptId)return;
  try{
    const base={kind:'quiz',stage,attempt:state.attemptId,level:levelLabel(),group:groupLabel()};
    sendToScript(stage==='completed'?Object.assign(base,quizSummary()):base).catch(()=>{});
  }catch(e){}
}

function submitLead(form){
  const fd=new FormData(form),g=k=>String(fd.get(k)||'').trim(),digits=v=>v.replace(/\D/g,'');
  const st=document.getElementById('l-status'),say=m=>{if(st)st.textContent=m;};
  if(g('website'))return;
  if(!digits(g('mobile'))&&!g('email')){say('Please give a mobile number or an email.');return;}
  if(g('mobile')&&digits(g('mobile')).length<10){say('Please check your mobile number.');return;}
  if(g('age')==='Under 18'&&digits(g('guardian')).length<10){say('Please add a parent or guardian’s mobile number.');return;}
  if(!CONTACT.endpoint){say('Sharing is not switched on yet.');return;}
  const payload=Object.assign({kind:'lead',name:g('name'),mobile:g('mobile'),email:g('email'),age:g('age'),guardian:g('guardian'),consent:!!fd.get('consent')},quizSummary());
  say('Sending…');
  sendToScript(payload).then(()=>{say('Thank you. Your result has been shared with Arohaanex Edvantage.');const b=document.getElementById('l-btn');if(b)b.disabled=true;}).catch(()=>say('We could not send it. Please try again, or contact us on WhatsApp.'));
}

function checkCompute(){
  const c=state.chk;
  const areas=CHECK_AREAS.map((a,i)=>{
    const pts=a.q.reduce((t,q)=>t+(c.ans[q[0]]||0),0),pct=Math.round(pts/(a.q.length*3)*100),b=bandOf(pct);
    return {i,n:a.n,pct,band:b[0],cls:b[1],evd:c.evd[i]===undefined?0:c.evd[i]};
  });
  const total=CHECK_AREAS.reduce((t,a)=>t+a.q.reduce((s,q)=>s+(c.ans[q[0]]||0),0),0);
  const overall=Math.round(total/120*100);
  const byHigh=[...areas].sort((x,y)=>y.pct-x.pct||x.i-y.i),byLow=[...areas].sort((x,y)=>x.pct-y.pct||x.i-y.i);
  const flagged=areas.filter(a=>(a.pct>=60&&a.evd<2)||a.i===2||a.i===5);
  return {areas,overall,band:bandOf(overall),strong:byHigh.slice(0,3),low:byLow.slice(0,3),flagged,unchecked:areas.filter(a=>a.evd===0).length};
}

function scorePaths(pct,subs){
  const raw=PATHS.map(p=>{
    const interest=[3,2,1].reduce((d,w,k)=>d+w*pct[p.code[k]],0)/6;
    const ws=Object.entries(p.w),tw=ws.reduce((a,x)=>a+x[1],0);
    const subject=ws.reduce((a,x)=>a+x[1]*((subs[x[0]]??2)/4),0)/tw;
    const low=ws.filter(x=>x[1]>=2&&(subs[x[0]]??2)<=1).map(x=>SUBJECTS.find(s=>s[0]===x[0])[1].split(' (')[0]);
    return {p,interest,subject,score:0.6*interest+0.4*subject-Math.min(0.2,0.1*low.length),low};
  });
  const min=Math.min(...raw.map(r=>r.score)),max=Math.max(...raw.map(r=>r.score));
  raw.forEach(r=>{r.norm=max>min?(r.score-min)/(max-min):0.7;});
  raw.sort((a,b)=>b.score-a.score);
  return raw;
}
function pathCareers(p){

  const open=sc.filter(s=>s.c.streams==='all').slice(0,4).map(s=>s.c.title);
  return {need,open};
}

/* ---------- LOGIC ---------- */
function compute(){
  const sums={R:0,I:0,A:0,S:0,E:0,C:0},subs={};
  state.questions.forEach((q,i)=>{const v=state.answers[i]||0;if(q.sub)subs[q.sub]=v;else sums[q.t]+=v;});
  const pct={};ORDER.forEach(t=>pct[t]=sums[t]/20);
  const ranked=[...ORDER].sort((a,b)=>pct[b]-pct[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const dots=CAREERS.map(c=>[3,2,1].reduce((d,w,k)=>d+w*pct[c.code[k]],0)/6);
  const min=Math.min(...dots),max=Math.max(...dots);
  const scored=CAREERS.map((c,i)=>({c,dot:dots[i],norm:max>min?(dots[i]-min)/(max-min):0.7}));
  scored.sort((a,b)=>b.dot-a.dot||a.c.title.localeCompare(b.c.title));
  state.result={pct,ranked,scored,subs};
  if(state.level==='after10')state.result.paths=scorePaths(pct,subs);
}

function render(){
  const gk=viewGate(state.view);
  if(gk&&!PR.user){authPrepare(gk,state.view);state.view='signin';}

  app.innerHTML=(gk&&PR.user)?gateView(gk,GATES[gk].title):v==='welcome'?welcome():v==='quiz'?quiz():v==='loading'?loadingView():v==='teachers'?teachers():v==='abroad'?abroad():v==='exams'?exams():v==='signin'?signinView():v==='account'?accountView():v==='schools'?schoolsPage():v==='about'?aboutPage():(v==='check'||v==='pulse')&&!canUse('check')?gateView('check','Academic Health Check'):v==='check'?checkView():v==='pulse'?pulseView():(state.level==='after10'?results10():results());
  syncNav();
}

function go(view){
  state.view=view;render();window.scrollTo(0,0);
  try{const hs=view==='teachers'?'#educators':view==='abroad'?'#abroad':view==='exams'?'#exams':view==='schools'?'#schools':view==='about'?'#about':(view==='check'||view==='pulse')?'#check':'';if(hs)history.replaceState(null,'',hs);else if(isEd(location.hash)||location.hash==='#abroad'||location.hash==='#exams'||location.hash==='#schools'||location.hash==='#about'||location.hash==='#contact'||location.hash==='#check')history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  const target=(view==='results'||view==='signin'||view==='account'||view==='teachers'||view==='abroad'||view==='exams'||view==='schools'||view==='about'||view==='check'||view==='pulse')?app.querySelector('h1'):view==='quiz'?document.getElementById('qtext'):null;
  if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}
  if(view==='results')animateCounts();
}
function answer(v){
  state.answers[state.i]=v;
  const idx=state.i;
  setTimeout(()=>{
    if(state.view!=='quiz'||state.i!==idx)return;
    if(idx<state.questions.length-1){state.i++;render();const q=document.getElementById('qtext');if(q)q.focus({preventScroll:true});}
    else{compute();trackQuiz('completed');state.view='loading';render();window.scrollTo(0,0);setTimeout(()=>{if(state.view==='loading')go('results');},reducedMotion()?250:1500);}
  },240);
}
function setRegions(t){
  const boxes=[...app.querySelectorAll('input[name="region"]')];
  if(t.value==='any'&&t.checked){state.regions=['any'];}
  else{
    const sel=boxes.filter(b=>b.checked&&b.value!=='any').map(b=>b.value);
    state.regions=sel.length?sel:['any'];
  }
  boxes.forEach(b=>{b.checked=state.regions.includes(b.value);});
}
