    if(box){box.textContent=errs.join(' ');box.hidden=!errs.length;}
    if(errs.length)return;
    showRequest(new FormData(e.target),files);return;}
  if(e.target.id==='chkstart'){
    e.preventDefault();const c=state.chk||(state.chk=newCheck()),v=id=>(document.getElementById(id)||{}).value||'';
    c.info={role:v('c-role'),board:v('c-board'),classes:v('c-classes'),students:v('c-students')};
    c.stage='q';c.sec=0;c.ans={};c.evd={};c.attempt=newAttemptId();trackCheck('started');render();window.scrollTo(0,0);return;}
  if(e.target.id==='checkshare'){e.preventDefault();submitCheckShare(e.target);return;}
  if(e.target.id==='schoolform'){e.preventDefault();showSchoolEnquiry(new FormData(e.target));return;}
  if(e.target.id==='leadform'){e.preventDefault();submitLead(e.target);return;}
  if(e.target.id!=='start')return;
  e.preventDefault();
  const lv=app.querySelector('input[name="level"]:checked');
  state.level=lv?lv.value:state.level;
  state.name=document.getElementById('name').value;
  if(state.level==='after10'){
    state.stream='unsure';state.questions=buildQuestions('unsure').concat(subjectQuestions());
  }else{
    const sel=app.querySelector('input[name="stream"]:checked');
    if(!sel){document.getElementById('err').hidden=false;return;}
    state.stream=sel.value;state.questions=buildQuestions(state.stream);
  }
  state.answers=[];state.i=0;
  state.attemptId=newAttemptId();trackQuiz('started');
  go('quiz');
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.name&&t.name.indexOf('chk-')===0&&state.chk){
    const v=parseInt(t.value,10);
    if(t.name.indexOf('chk-evd-')===0)state.chk.evd[parseInt(t.name.slice(8),10)]=v;else state.chk.ans[t.name.slice(4)]=v;
    const er=document.getElementById('chk-err');if(er)er.hidden=true;return;}
  if(t.id==='ab-budget'){state.abroadBudget=parseInt(t.value,10)||0;const tb=document.getElementById('ab-table');if(tb)tb.innerHTML=abroadTable();else refreshAb();return;}
  if(t.id==='ab-switch'){state.abId=t.value;render();return;}
  if(t.id&&t.id.indexOf('pr-')===0){prChange(t);return;}
  if(t.id==='ex-jump'){if(t.value){state.exMode='exam';state.exId=t.value;state.exTab='about';state.exGoal='';render();exFocusTop();}return;}
  if(t.id==='ex-switch'){state.exId=t.value;state.exTab='about';if(state.exGoal&&!exById(t.value).goals.includes(state.exGoal))state.exGoal='';render();exFocusTop();return;}
  if(t.name==='level'){const nm=document.getElementById('name');if(nm)state.name=nm.value;state.level=t.value;render();return;}
  if(t.id==='t-files'){
    const arr=Array.from(t.files||[]),errs=checkFiles(arr),box=document.getElementById('t-files-err'),list=document.getElementById('t-files-list');
    if(box){box.textContent=errs.join(' ');box.hidden=!errs.length;}
    if(list)list.innerHTML=arr.map(f=>'<li>'+esc(f.name)+' ('+fmtSize(f.size)+')</li>').join('');
    return;}
  if(t.name==='ans'){answer(parseInt(t.value,10));return;}
  if(t.name==='stream'){const err=document.getElementById('err');if(err)err.hidden=true;return;}
  if(t.name==='region'){setRegions(t);if(state.view==='results'){state.filters.allC=false;refresh();}return;}
  if(t.id==='f-stream'){state.stream=t.value;}
  else if(t.id==='f-only'){state.filters.only=t.checked;}
  else if(t.id==='f-grade'){state.minGrade=parseInt(t.value,10);}
  else if(t.id==='f-kind'){state.kind=t.value;}
  else if(t.id==='f-focus'){state.focus=t.checked;}
  else return;
  state.filters.all=false;state.filters.allC=false;
  refresh();
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='au-email'){e.preventDefault();auAction('au-send',e.target);}
  else if(e.target.id==='au-code'){e.preventDefault();auAction('au-verify',e.target);}
});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='back'&&state.i>0){state.i--;render();const q=document.getElementById('qtext');if(q)q.focus({preventScroll:true});return;}
  const act=b.dataset.act;
  if(act==='all'){state.filters.all=true;refresh();}
  else if(act==='allc'){state.filters.allC=true;refresh();}
  else if(act==='cards'||act==='table'){state.view2=act;refresh();}
  else if(act==='teachers')go('teachers');
  else if(act==='schools')go('schools');
  else if(act==='about')go('about');
  else if(act==='chk-open'||act==='chk-restart'){if(!canUse('check'))authOpen('check');else{state.chk=newCheck();go('check');}}
  else if(act==='chk-next')chkNext();
  else if(act==='chk-back'){state.chk.sec=Math.max(0,state.chk.sec-1);render();window.scrollTo(0,0);}
  else if(act==='chk-print')window.print();
  else if(act==='chk-pulse')go('pulse');
  else if(act==='chk-result')go('check');
  else if(act==='chk-talk'){go('schools');setTimeout(()=>{const f=document.getElementById('s-interest');if(f)f.value='Academic Health Check';const fm=document.getElementById('schoolform');if(fm)fm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});},60);}
  else if(act==='contact'){go('about');scrollToContact();}
  else if(act==='school-pick'){const f=document.getElementById('s-interest');if(f&&b.dataset.p)f.value=b.dataset.p;const fm=document.getElementById('schoolform');if(fm){fm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});const n=document.getElementById('s-school');if(n)n.focus({preventScroll:true});}}
  else if(act==='abroad'){state.abMode='pick';go('abroad');}
  else if(act==='ab-pick'){state.abMode='country';state.abId=b.dataset.id;state.abTab='opp';render();window.scrollTo(0,0);const h=app.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}
  else if(act==='ab-back'){state.abMode='pick';render();window.scrollTo(0,0);}
  else if(act==='ab-compare'){state.abMode='compare';render();window.scrollTo(0,0);}
  else if(act==='ab-tab'){state.abTab=b.dataset.tab;refreshAb();}
  else if(act&&exAction(act,b)){}
  else if(act==='home')go('welcome');
  else if(act==='share')shareCard();
  else if(act==='copy')copyRequest(b);
  else if(act==='sample'){const pl=document.getElementById('t-plan');if(pl)pl.value='Free sample request';const f=document.getElementById('treq');if(f){f.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});const n=document.getElementById('t-name');if(n)n.focus({preventScroll:true});}}
  else if(act==='pick'){const sel=document.getElementById('t-type');if(sel)sel.value=b.dataset.t;const f=document.getElementById('treq');if(f){f.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});const n=document.getElementById('t-name');if(n)n.focus({preventScroll:true});}}
  else if(act==='print'){window.print();}
  else if(act==='retake'){state.answers=[];state.i=0;state.questions=[];state.result=null;state.filters={only:true,all:false,allC:false};go('welcome');}
});
document.addEventListener('keydown',e=>{
  if(state.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=5){
    const r=app.querySelector(`input[name="ans"][value="${n-1}"]`);
    if(r){r.checked=true;answer(n-1);}
  }
});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=el.dataset.count+'%';});document.querySelectorAll('details.career').forEach(d=>{d.dataset.was=d.open?'1':'0';d.open=true;});});
window.addEventListener('afterprint',()=>{document.querySelectorAll('details.career').forEach(d=>{d.open=d.dataset.was==='1';});});

const menuBtn=document.getElementById('nav-student'),menuList=document.getElementById('menu-student-list');
const closeMenu=()=>{if(menuList)menuList.hidden=true;if(menuBtn)menuBtn.setAttribute('aria-expanded','false');};
document.querySelector('.site-head').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='nav-student'){const open=menuList.hidden;menuList.hidden=!open;menuBtn.setAttribute('aria-expanded',String(open));return;}
  closeMenu();
  if(b.dataset.act==='teachers')go('teachers');
  else if(b.dataset.act==='abroad'){state.abMode='pick';go('abroad');}
  else if(b.dataset.act==='exams'){state.exMode='pick';state.exGoal='';go('exams');}
  else if(b.dataset.act==='schools')go('schools');
  else if(b.dataset.act==='about')go('about');
  else if(b.dataset.act==='home')go('welcome');
});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuList&&!menuList.hidden){closeMenu();if(menuBtn)menuBtn.focus();}});
window.addEventListener('hashchange',()=>{if(isEd(location.hash)&&state.view!=='teachers')go('teachers');else if(location.hash==='#abroad'&&state.view!=='abroad')go('abroad');else if(location.hash==='#exams'&&state.view!=='exams'){state.exMode='pick';go('exams');}else if(location.hash==='#schools'&&state.view!=='schools')go('schools');else if(location.hash==='#about'&&state.view!=='about')go('about');else if(location.hash==='#contact'){go('about');scrollToContact();}else if(location.hash==='#check'&&state.view!=='check'&&state.view!=='pulse'){state.chk=newCheck();go('check');}});
if(isEd(location.hash))state.view='teachers';else if(location.hash==='#abroad')state.view='abroad';else if(location.hash==='#exams')state.view='exams';else if(location.hash==='#schools')state.view='schools';else if(location.hash==='#about'||location.hash==='#contact')state.view='about';else if(location.hash==='#check')state.view='check';
document.getElementById('brand-mark').src=BRAND_MARK;
prBoot();
render();
if(location.hash==='#contact')scrollToContact();
</script>
</body>
</html>
