<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --text:#0E1A3A; --muted:#4A5677; --line:#D8DDEC;
  --accent:#14338F; --accent-soft:#E6ECFB; --on-accent:#FFFFFF;
  --mark:#E6B84A; --mark-ink:#2E2200; --danger:#B3261E;
  --font-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080D20; --surface:#111A38; --text:#EEF1FB; --muted:#A5B0CE; --line:#26325E;
    --accent:#8FB0FF; --accent-soft:#18265A; --on-accent:#08112E; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080D20; --surface:#111A38; --text:#EEF1FB; --muted:#A5B0CE; --line:#26325E;
  --accent:#8FB0FF; --accent-soft:#18265A; --on-accent:#08112E; --danger:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1.0625rem;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-.015em}
h1{font-weight:800;font-size:clamp(2.1rem,5.4vw,3.4rem);letter-spacing:-.025em}
h2{font-weight:800;font-size:clamp(1.45rem,3.2vw,2rem)}
h3{font-weight:600;font-size:1.25rem;line-height:1.2}
h4{font-weight:600;font-size:1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:1.25rem 1.25rem 3.5rem}
.site-head{display:flex;align-items:center;gap:.65rem;padding:.4rem 0 1.75rem;font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.site-head small{font-family:var(--font-body);font-weight:400;font-size:.95rem;color:var(--muted)}
.lead{font-size:1.15rem;color:var(--muted);max-width:58ch;margin-top:1rem}

/* welcome */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:start}
.hero-art{max-width:460px;width:100%;justify-self:center;position:sticky;top:1rem}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:1.5rem}.hero-art{order:2;position:static}}
form{margin-top:1.75rem;max-width:560px}
.field{margin:0 0 1.35rem;padding:0;border:0;min-width:0}
.field>label,.field>legend{display:block;font-weight:700;margin-bottom:.5rem;padding:0}
.note{font-weight:400;color:var(--muted)}
input[type=text]{width:100%;min-height:48px;padding:.65rem .85rem;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=text]:focus-visible{border-color:var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;padding:.55rem .9rem;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;line-height:1.25}
.chip small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.chip input:checked + span{border-color:var(--accent);background:var(--accent-soft)}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:3px}
.hint{font-size:.9rem;color:var(--muted);margin-top:.6rem}
.err{color:var(--danger);font-weight:700;margin-top:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7rem 1.4rem;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.07)}

/* quiz */
.quiz{max-width:780px;margin:0 auto}
.progress-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:.5rem}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease}
.q-stem{margin-top:2.25rem;color:var(--muted)}
.q-text{margin-top:.35rem;font-family:var(--font-display);font-weight:600;font-size:clamp(1.55rem,4vw,2.3rem);line-height:1.15;letter-spacing:-.015em;outline:none}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin:2rem 0 1.25rem;border:0;padding:0}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:92px;padding:.6rem .4rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;font-weight:700;line-height:1.2}
.face b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.opt:hover .face{border-color:var(--accent)}
.opt input:checked + .face{border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked + .face b{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt input:focus-visible + .face{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:640px){
  .opts{grid-template-columns:1fr;gap:.5rem}
  .face{flex-direction:row;justify-content:flex-start;min-height:54px;padding:.5rem .9rem;gap:.8rem;text-align:left}
}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;padding:.5rem .25rem;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px}
.linkbtn[disabled]{visibility:hidden}

/* results */
.print-only{display:none}
.res-head{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:flex-end}
.res-head .lead{margin-top:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.profile{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:2rem;align-items:center;margin-top:2rem;padding:1.5rem;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
@media (max-width:820px){.profile{grid-template-columns:1fr;padding:1rem}}
.top3{display:grid;gap:1.1rem}
.t3{padding-left:1rem;border-left:5px solid var(--line)}
.t3:first-child{border-left-color:var(--mark)}
.t3 h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem}
.t3 h3 span{font-family:var(--font-body);font-weight:400;font-size:.95rem;color:var(--muted)}
.t3 p{margin-top:.3rem;max-width:52ch}
.t3 .school{color:var(--muted);font-size:.95rem}
.low-note{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;background:var(--accent-soft)}
section.block{margin-top:3rem}
.sub{color:var(--muted);max-width:70ch;margin-top:.6rem}
.filters{display:flex;flex-wrap:wrap;gap:.85rem 1.5rem;align-items:center;margin:1.1rem 0 1.25rem;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.filters label.f{display:flex;align-items:center;gap:.5rem;font-weight:700}
.filters select{min-height:44px;padding:.4rem .6rem;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.filters input[type=checkbox].plain{width:20px;height:20px;accent-color:var(--accent)}
.filters .regions{flex:1 1 100%}
.filters .regions .chip span{padding:.4rem .8rem;font-size:.95rem}
.filters .regions .chip small{display:none}
.filter-title{font-weight:700;margin-bottom:.4rem}
.count{color:var(--muted);margin-bottom:.75rem}
.list{display:grid;gap:.8rem}
details.career{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.career[open]{border-color:var(--accent)}
details.career>summary{list-style:none;display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;padding:1.1rem 1.25rem;cursor:pointer}
details.career>summary::-webkit-details-marker{display:none}
.c-main{display:block;flex:1;min-width:0}
.c-sum{display:block;margin-top:.3rem;color:var(--muted)}
.c-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chip-fit{display:inline-block;padding:.15rem .65rem;border-radius:999px;font-size:.85rem;font-weight:700}
.chip-fit.top{background:var(--mark);color:var(--mark-ink)}
.chip-fit.mid{background:var(--accent-soft);color:var(--accent)}
.chip-fit.low{border:1px solid var(--line);color:var(--muted)}
.tag{display:inline-block;padding:.15rem .65rem;border-radius:6px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.fit-bar{display:block;height:5px;margin-top:.8rem;border-radius:3px;background:var(--line);max-width:340px}
.fit-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.chev{flex:none;width:12px;height:12px;margin-top:.55rem;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(45deg);transition:transform .2s ease}
details[open] .chev{transform:rotate(-135deg)}
.c-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.25rem 1.75rem;padding:1.1rem 1.25rem 1.3rem;border-top:1px solid var(--line)}
.c-body h4{margin-bottom:.4rem}
.c-body ul{margin:0;padding-left:1.15rem}
.c-body li{margin:.15rem 0}
.c-wide{grid-column:1/-1;padding:.9rem 1rem;border-radius:10px;background:var(--accent-soft)}
.c-wide ul{list-style:none;padding:0}
.c-wide li{margin:.35rem 0}
.c-wide .none{color:var(--muted)}
.more{margin-top:1rem}
.empty{padding:1.25rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.steps{margin:1rem 0 0;padding-left:1.4rem;max-width:62ch}
.steps li{margin:.5rem 0;padding-left:.3rem}
.disclaimer{margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;max-width:80ch}

/* NAAC grade chips and college cards */
.g{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;vertical-align:middle}
.g3{background:var(--mark);color:var(--mark-ink)}
.g2{background:var(--accent-soft);color:var(--accent)}
.g1{border:1px solid var(--line);color:var(--muted)}
.naac-note{margin-top:1.25rem;padding:1rem 1.2rem;border-left:5px solid var(--mark);border-radius:0 10px 10px 0;background:var(--surface);max-width:80ch}
.naac-note h3{font-size:1.05rem;margin-bottom:.4rem}
.naac-note p+p{margin-top:.5rem}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.inst{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);break-inside:avoid}
.inst-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.inst h3{font-size:1.05rem;line-height:1.25}
.inst .loc{margin-top:.2rem;color:var(--muted);font-size:.95rem}
.inst .note2{margin-top:.5rem;font-size:.95rem}
.inst .fields{margin-top:.5rem;font-size:.9rem;color:var(--muted)}
.inst .src{margin-top:.5rem;font-size:.82rem;color:var(--muted)}


/* admissions */
.st{display:inline-block;padding:.05rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.st-open{background:var(--accent);color:var(--on-accent)}
.st-soon{background:var(--mark);color:var(--mark-ink)}
.st-info{background:var(--accent-soft);color:var(--accent)}
.st-closed{border:1px solid var(--line);color:var(--muted)}
.left{display:inline-block;margin-left:.4rem;padding:.02rem .5rem;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:700}
.left.urgent{background:var(--mark);color:var(--mark-ink)}
.btn.small{min-height:40px;padding:.35rem .9rem;font-size:.92rem;border-radius:8px}
.alert{margin-top:1.25rem;padding:.85rem 1.1rem;border-left:5px solid var(--mark);border-radius:0 10px 10px 0;background:var(--surface)}
.adm{margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--line);font-size:.95rem}
.adm h4{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.4rem}
.adm p{margin-top:.35rem}
.adm .links{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.5rem}
.adm-none{color:var(--muted)}
.dls{display:grid;gap:.8rem;margin-top:1rem}
.dl{display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;justify-content:space-between;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dl-main{flex:1 1 320px;min-width:0}
.dl h3{font-size:1.1rem}
.dl-when{margin-top:.3rem}
.dl-sub{margin-top:.25rem;color:var(--muted);font-size:.95rem}
.dl-side{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
.how{margin-top:1rem;display:grid;gap:.7rem;max-width:80ch}
.how details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 1.1rem}
.how summary{cursor:pointer;font-weight:700;padding:.9rem 0}
.how details[open] summary{border-bottom:1px solid var(--line)}
.how ul,.how ol{padding-left:1.3rem;margin:.8rem 0}
.how li{margin:.45rem 0}
.how .hint{margin:0 0 1rem}


.web{margin-top:.5rem;font-size:.95rem}
.web a,.tbl a{color:var(--accent);font-weight:700;word-break:break-all}
.vf{display:inline-block;margin-left:.3rem;padding:.02rem .5rem;border-radius:6px;font-size:.78rem;font-weight:700;vertical-align:middle}
.vf-ok{background:var(--accent);color:var(--on-accent)}
.vf-chk{background:var(--mark);color:var(--mark-ink)}
.toggle{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;min-width:640px}
.tbl th{position:static;text-align:left;padding:.7rem .9rem;background:var(--accent-soft);color:var(--text);font-family:var(--font-display);font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .hint{margin:0;font-size:.85rem}


.brand-mark{height:44px;width:auto;display:block;border-radius:10px;background:#000;flex:none}
.brand-foot{display:flex;justify-content:center;margin-top:3rem}
.brand-foot img{width:100%;max-width:420px;height:auto;display:block;border-radius:18px}
.brand-foot+.contact{margin-top:1.1rem}
.contact{text-align:center;color:var(--muted);font-size:.95rem}
.contact a{color:var(--accent);font-weight:700}
.contact+.disclaimer{margin-top:1.5rem}
.print-only img{height:32px;width:auto;vertical-align:middle;margin-right:.6rem;border-radius:6px}


.sbars{display:grid;gap:.5rem;margin-top:1rem;max-width:620px}
.sb{display:grid;grid-template-columns:150px 1fr 120px;gap:.8rem;align-items:center}
.sb .bar.sm{height:10px}
.sb .sv{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.sb{grid-template-columns:1fr 1fr;row-gap:.2rem}.sb .bar.sm{grid-column:1/-1;order:3}}
.flow{list-style:none;padding:0;margin:1rem 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem}
.flow li{display:flex;flex-direction:column;gap:.3rem;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.flow b{color:var(--accent);font-family:var(--font-display)}
.flow .hint{margin:0;font-size:.9rem}
.c-warn{background:var(--mark);color:var(--mark-ink)}
.c-warn h4,.c-warn p{color:var(--mark-ink)}

/* motion and brand polish */
.site-head{justify-content:space-between;flex-wrap:wrap;gap:.8rem 1.2rem}
.brand{display:flex;align-items:center;gap:.65rem}
.topnav{display:flex;gap:.4rem;flex-wrap:wrap}
.topnav button{min-height:44px;padding:.4rem 1rem;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-family:var(--font-body);font-weight:700;font-size:.95rem;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.topnav button:hover{border-color:var(--accent);transform:translateY(-1px)}
.topnav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{transition:transform .15s ease,filter .15s ease,background .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.chip span,.face{transition:border-color .15s,background .15s,transform .15s}
.chip:hover span{border-color:var(--accent);transform:translateY(-1px)}
details.career{transition:border-color .2s ease,transform .2s ease}
details.career:hover{border-color:var(--accent)}
:root{interpolate-size:allow-keywords}
details.career::details-content{block-size:0;overflow:clip;transition:block-size .32s ease,content-visibility .32s ease allow-discrete}
details.career[open]::details-content{block-size:auto}
.ic{display:inline-grid;place-items:center;width:1.9em;height:1.9em;margin-right:.5rem;border-radius:50%;background:var(--accent-soft);font-size:.85em;vertical-align:middle}
.badge{display:inline-block;margin:0 0 1rem;padding:.4rem .9rem;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-size:.95rem}
.t3 h3 span b{font-weight:400}
.quiz{animation:qin .38s cubic-bezier(.2,.8,.2,1) both}
.quiz.sub .bar>i{background:var(--mark)}
.quiz.sub .opt input:checked + .face{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 24%,var(--surface))}
.quiz.sub .opt input:checked + .face b{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.opt input:checked + .face{animation:pop .3s ease}
.fit-bar i{transform-origin:left center;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.profile,section.block{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.hero-art svg{animation:float 7s ease-in-out infinite}
.shine{position:relative;overflow:hidden;border-radius:18px;line-height:0;max-width:420px;width:100%}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.26) 50%,transparent 58%);transform:translateX(-130%);animation:shine 7s ease-in-out 1.5s infinite}
.loading{display:grid;justify-items:center;text-align:center;gap:1rem;padding:5rem 1rem}
.compass{width:130px;height:130px}
.compass .needle{transform-box:view-box;transform-origin:60px 60px;animation:swing 1.1s ease-in-out infinite alternate}
.compass .ring{transform-box:view-box;transform-origin:60px 60px;animation:spin 1.6s linear infinite}
.thead{padding:1rem 0 .5rem;max-width:720px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem}
.tsvc{padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:transform .2s ease,border-color .2s ease}
.tsvc:hover{transform:translateY(-3px);border-color:var(--accent)}
.tsvc .ic{margin:0 0 .6rem;font-size:1.5rem;width:2.2em;height:2.2em}
.tsvc p{margin-top:.4rem;color:var(--muted);font-size:.97rem}
.tform{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem 1.2rem;max-width:900px;margin-top:1.2rem}
.tform .full{grid-column:1/-1}
.tform label{display:block;font-weight:700;margin-bottom:.35rem}
.tform input,.tform select,.tform textarea{width:100%;min-height:48px;padding:.65rem .85rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:inherit}
.tform textarea{min-height:130px;resize:vertical}
.tform .consent{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin:0}
.tform .consent input{width:22px;height:22px;min-height:0;margin-top:.15rem;flex:none;accent-color:var(--accent)}
.tform input:focus-visible,.tform select:focus-visible,.tform textarea:focus-visible{border-color:var(--accent);outline-offset:1px}
.tout{margin-top:1.4rem;padding:1.2rem;border:2px solid var(--accent);border-radius:14px;background:var(--surface);max-width:900px;animation:rise .4s ease both}
.tpre{margin:.8rem 0;padding:1rem;border-radius:10px;background:var(--accent-soft);white-space:pre-wrap;word-break:break-word;font-family:var(--font-body);font-size:.95rem}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes swing{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.topnav,.shine::after{display:none!important}.quiz,.profile,section.block,.fit-bar i{animation:none!important}}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;margin-top:1.4rem;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:.5rem;padding:1.5rem 1.3rem 1.3rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:transform .2s ease,border-color .2s ease}
.plan:hover{transform:translateY(-3px);border-color:var(--accent)}
.plan.best{border:2px solid var(--mark)}
.plan .ribbon{position:absolute;top:-.85rem;left:1rem;padding:.15rem .75rem;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:.85rem}
.plan .price{margin-top:.2rem}
.plan .price b{font-family:var(--font-display);font-size:2.3rem;letter-spacing:-.02em}
.plan ul{margin:.4rem 0 1rem;padding-left:1.15rem;flex:1}
.plan li{margin:.3rem 0}
.plan .btn{align-self:flex-start}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.flist{margin:.4rem 0 0;padding-left:1.1rem;font-size:.92rem}
.tform input[type=file]{padding:.55rem .6rem;min-height:0}
.terms{max-width:80ch;padding-left:1.3rem}
.terms li{margin:.75rem 0}
.hint a,.sub a,.consent a{color:var(--accent);font-weight:700}

/* hexagon */
.hx-grid{fill:none;stroke:var(--line);stroke-width:1.2}
.hx-axis{stroke:var(--line);stroke-width:1}
.hx-fill{fill:var(--accent);fill-opacity:.24;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.hx-dot{fill:var(--accent)}
.hx-dot.top{fill:var(--mark);stroke:var(--text);stroke-width:1.5}
.hx-name{fill:var(--text);font-family:var(--font-display);font-weight:800;font-size:16px}
.hx-sub{fill:var(--muted);font-size:13px}
.hx-shape{transform-box:view-box;transform-origin:200px 170px;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scale(.12);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hx-shape{animation:none}.bar>i,.chev{transition:none}}

@media print{
  html:root:root:root{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--line:#bbb;--accent:#0C7C86;--accent-soft:#eef7f7;--on-accent:#fff;color-scheme:light}
  :root{padding:0}
  .noprint,.filters,.actions,.more,.chev,.brand-foot{display:none!important}
  .print-only{display:block;color:var(--muted);margin-bottom:.5rem}
  .wrap{padding:0}
  details.career,.profile,.t3,.inst,.naac-note,.dl,.flow li{break-inside:avoid}
  .how details{border:0}
  .btn.small{border:0;padding:0;text-decoration:underline;color:var(--accent);background:none;min-height:0}
  .hx-shape{animation:none}
}
</style>
</head>

  <div class="site-head noprint">

    <nav class="topnav" aria-label="Sections"><button type="button" id="nav-home" data-act="home">Career Guidance</button><button type="button" id="nav-teachers" data-act="teachers">Educator Hub</button></nav>
  </div>

</div>

function buildQuestions(stream){
  const picks={};
  ORDER.forEach(t=>{
    const fixed=QPOOL[t].filter(x=>ANCHORS[t].includes(x[0])).map(x=>({text:x[0]}));
    const pool=QPOOL[t].filter(x=>!ANCHORS[t].includes(x[0])).map(x=>({text:x[0],st:x[1]}));
    const chosen=[];
    for(let n=0;n<2;n++){
      const w=pool.map(q=>(!stream||stream==='unsure'||!q.st.length)?2:((q.st.includes(stream)||(stream==='mbipc'&&(q.st.includes('mpc')||q.st.includes('bipc')))||(stream==='aec'&&q.st.includes('cec')))?4:0.5));
      let r=Math.random()*w.reduce((a,b)=>a+b,0),idx=0;
      for(;idx<w.length-1;idx++){r-=w[idx];if(r<=0)break;}
      chosen.push(pool.splice(idx,1)[0]);
    }
    picks[t]=shuffle(fixed.concat(chosen));
  });
  const out=[];
  for(let k=0;k<5;k++){shuffle([...ORDER]).forEach(t=>out.push({t,text:picks[t][k].text}));}
  return out;
}

function admBlock(i){

  const left=a.iso?` <span class="left${daysLeft(a.iso)>=0&&daysLeft(a.iso)<=14?' urgent':''}">${dlText(a.iso)}</span>`:'';
  return `<div class="adm"><h4>Admissions <span class="st ${ST[a.st][1]}">${a.head||ST[a.st][0]}</span></h4>

   <li><strong>CUET-UG (Delhi University colleges and many central universities).</strong> You register once with NTA, not with each college. You fill in your details, choose your subjects (a portal reports up to five, including one language), upload your photo and signature, pay a fee based on the number of subjects, and download the confirmation page. After the results you follow each university’s own admission or counselling process.</li>
   <li><strong>CHRIST University.</strong> Apply on its admission portal, fill the programme form, pay the fee and upload your marks cards. Programmes with an entrance test use an online test on 5 Dec 2026, then a skills assessment and interview.</li>
   <li><strong>JAIN University.</strong> Register, verify the OTP, fill in the form, upload documents and pay the fee on its website. Admission is mainly through the Jain Entrance Test.</li>
   <li><strong>Symbiosis (SET).</strong> You apply for the exam at set-test.org, take SET in May 2027, then register for specific institutes and attend a personal interaction round. All dates are expected, not yet official.</li>
   <li><strong>VIT (VITEEE) and Manipal (MET).</strong> Both are online applications for B.Tech. VIT’s closing date is 31 Mar 2027. Manipal’s Phase 1 closes in March 2027, and its fee covers an application part and a test part.</li>
   <li><strong>Law (CLAT).</strong> Register on the Consortium of NLUs website, fill the form, upload documents and pay by 31 Oct 2026. A correction window usually follows the closing date.</li>
  </ul>
 </details>
 <details><summary>Avoid mistakes and fake sites</summary>
  <ul><li>Check that the college is on the UGC and NAAC lists before you pay anything.</li>
  <li>No genuine college sells a “guaranteed seat” or asks you to pay the fee to a personal account.</li>
  <li>Use one email and phone number for every form so nothing gets lost.</li>
  <li>Set calendar reminders for the application deadline, the admit card date, and the seat-fee deadline.</li></ul>

function hexSVG(pct,top){
  const cx=200,cy=170,r=100,lr=128;
  const ang=k=>(-90+60*k)*Math.PI/180;
  const pt=(k,s)=>[cx+Math.cos(ang(k))*r*s,cy+Math.sin(ang(k))*r*s];
  const poly=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let g='';
  [1/3,2/3,1].forEach(s=>{g+=`<polygon class="hx-grid" points="${poly(ORDER.map((t,k)=>pt(k,s)))}"/>`;});
  ORDER.forEach((t,k)=>{const p=pt(k,1);g+=`<line class="hx-axis" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`;});
  if(pct){
    const sp=ORDER.map((t,k)=>pt(k,Math.max(pct[t],0.05)));
    g+=`<g class="hx-shape"><polygon class="hx-fill" points="${poly(sp)}"/>`;
    ORDER.forEach((t,k)=>{g+=`<circle class="hx-dot${top&&top.includes(t)?' top':''}" cx="${sp[k][0].toFixed(1)}" cy="${sp[k][1].toFixed(1)}" r="${top&&top.includes(t)?7:4.5}"/>`;});
    g+='</g>';
  }
  ORDER.forEach((t,k)=>{
    const c=Math.cos(ang(k)),s=Math.sin(ang(k));
    const lx=cx+c*lr,ly=cy+s*lr;
    const anchor=Math.abs(c)<0.2?'middle':(c>0?'start':'end');
    const y1=ly+(s<-0.9?-20:(s>0.9?14:-2));
    const sub=pct?pctText(pct[t]):TYPE[t].verb;
    g+=`<text class="hx-name" x="${lx.toFixed(1)}" y="${y1.toFixed(1)}" text-anchor="${anchor}">${TYPE[t].name}</text><text class="hx-sub" x="${lx.toFixed(1)}" y="${(y1+16).toFixed(1)}" text-anchor="${anchor}"${pct?` data-count="${Math.round(pct[t]*100)}"`:''}>${sub}</text>`;
  });
  const label=pct?'Interest profile: '+ORDER.map(t=>TYPE[t].name+' '+pctText(pct[t])).join(', '):'The six interest types: '+ORDER.map(t=>TYPE[t].name).join(', ');
  return `<svg viewBox="0 0 400 340" role="img" aria-label="${label}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

function animateCounts(){
  if(reducedMotion())return;
  document.querySelectorAll('[data-count]').forEach((el,k)=>{
    const end=+el.dataset.count,t0=performance.now()+150+k*45,dur=900;
    el.textContent='0%';
    const tick=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);el.textContent=Math.round(end*e)+'%';if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
}
function progressMsg(i,n,q){
  if(q.sub)return i===n-1?'Last one':'Nearly there';
  const p=i/n;
  return i===0?'Let’s begin':p<0.34?'Good start':p<0.6?'Halfway there':p<0.85?'Keep going':'Last few questions';
}

function shareCard(){
  const r=state.result,top=r.ranked.slice(0,3),nm=state.name.trim();
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  const FD='"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif';
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#000000');bg.addColorStop(1,'#0B1535');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const img=new Image();
  img.onload=()=>{
    const lw=560,lh=lw*img.height/img.width;g.drawImage(img,(W-lw)/2,24,lw,lh);
    g.textAlign='center';
    g.fillStyle='#F0C964';g.font='700 44px '+FD;g.fillText((nm?nm+'’s':'My')+' interest profile',W/2,340);

    g.fillStyle='#A5B0CE';g.font='400 36px '+FD;g.fillText('with a '+ARCH[top[1]]+' streak',W/2,482);
    const cx=W/2,cy=870,R=240,ang=k=>(-90+60*k)*Math.PI/180,P=(k,s)=>[cx+Math.cos(ang(k))*R*s,cy+Math.sin(ang(k))*R*s];
    [1/3,2/3,1].forEach(s=>{g.beginPath();ORDER.forEach((t,k)=>{const p=P(k,s);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.closePath();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;g.stroke();});
    ORDER.forEach((t,k)=>{const p=P(k,1);g.beginPath();g.moveTo(cx,cy);g.lineTo(p[0],p[1]);g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;g.stroke();});
    g.beginPath();ORDER.forEach((t,k)=>{const p=P(k,Math.max(r.pct[t],0.05));k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.closePath();
    g.fillStyle='rgba(240,201,100,.30)';g.fill();g.strokeStyle='#F0C964';g.lineWidth=6;g.lineJoin='round';g.stroke();
    ORDER.forEach((t,k)=>{

      g.beginPath();g.arc(p[0],p[1],hot?15:9,0,Math.PI*2);g.fillStyle=hot?'#F0C964':'#8FB0FF';g.fill();
      const lx=cx+Math.cos(ang(k))*(R+78),ly=cy+Math.sin(ang(k))*(R+64);
      g.fillStyle='#FFFFFF';g.font='700 34px '+FD;g.fillText(TYPE[t].name,lx,ly);
      g.fillStyle='#A5B0CE';g.font='400 28px '+FD;g.fillText(pctText(r.pct[t]),lx,ly+36);
    });
    g.fillStyle='#F0C964';g.font='700 38px '+FD;
    const line=state.level==='after10'&&r.paths?'Best-fit pathway: '+r.paths[0].p.title:'Top interests: '+top.map(t=>TYPE[t].name).join(', ');
    g.fillText(line.length>52?line.slice(0,50)+'…':line,W/2,1210);
    g.fillStyle='#FFFFFF';g.font='400 32px '+FD;g.fillText('Take the quiz at students.arohaanex.com',W/2,1270);

function buildRequest(fd,files){
  files=files||[];

  const d=new Date(),id='AE-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(1000+Math.random()*9000);
  const lines=['Educator Hub request '+id,'Name: '+g('name'),'School: '+(g('school')||'-'),'Board: '+(g('board')||'-')+' | Class: '+(g('cls')||'-')+' | Subject: '+(g('subject')||'-'),'Request: '+g('type'),'Plan: '+(g('plan')||'-'),'Details: '+g('details'),'Needed by: '+(g('due')||'-'),'Format: '+(g('format')||'Any')+' | Language: '+(g('lang')||'English'),'Email: '+g('email'),'Phone or WhatsApp: '+(g('phone')||'-'),'Files: '+(files.length?files.map(f=>f.name).join(', '):'none'),'Documents link: '+(g('doclink')||'-'),'Consent to terms and storage: '+(fd.get('consent')?'Yes':'No')];
  const data={id,name:g('name'),school:g('school'),board:g('board'),cls:g('cls'),subject:g('subject'),type:g('type'),plan:g('plan'),details:g('details'),due:g('due'),format:g('format'),lang:g('lang'),email:g('email'),phone:g('phone'),consent:!!fd.get('consent'),doclink:g('doclink'),hp:g('website'),text:lines.join('\n')};
  return {id,text:lines.join('\n'),data};
}

function copyRequest(btn){
  if(!state.treq)return;
  const done=()=>{btn.textContent='Copied';setTimeout(()=>{btn.textContent='Copy request';},2000);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(state.treq.text).then(done).catch(()=>{});}
  else{const ta=document.createElement('textarea');ta.value=state.treq.text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
}

/* Conservative limits, because the files are sent through a Google Apps Script web app. */
const UP={maxFiles:5,maxEach:4*1024*1024,maxTotal:8*1024*1024,ext:['pdf','doc','docx','ppt','pptx','xls','xlsx','csv','txt','jpg','jpeg','png']};
const fmtSize=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
function checkFiles(files){
  const errs=[];let total=0;
  if(files.length>UP.maxFiles)errs.push('Please attach at most '+UP.maxFiles+' files.');
  files.forEach(f=>{
    const ext=(String(f.name).split('.').pop()||'').toLowerCase();
    if(!UP.ext.includes(ext))errs.push(f.name+': this file type is not allowed.');

function scorePaths(pct,subs){
  const raw=PATHS.map(p=>{
    const interest=[3,2,1].reduce((d,w,k)=>d+w*pct[p.code[k]],0)/6;
    const ws=Object.entries(p.w),tw=ws.reduce((a,x)=>a+x[1],0);
    const subject=ws.reduce((a,x)=>a+x[1]*((subs[x[0]]??2)/4),0)/tw;
    const low=ws.filter(x=>x[1]>=2&&(subs[x[0]]??2)<=1).map(x=>SUBJECTS.find(s=>s[0]===x[0])[1].split(' (')[0]);
    return {p,interest,subject,score:0.6*interest+0.4*subject-Math.min(0.2,0.1*low.length),low};
  });
  const min=Math.min(...raw.map(r=>r.score)),max=Math.max(...raw.map(r=>r.score));
  raw.forEach(r=>{r.norm=max>min?(r.score-min)/(max-min):0.7;});
  raw.sort((a,b)=>b.score-a.score);
  return raw;
}
function pathCareers(p){
  if(p.careers)return {need:p.careers,open:[]};
  const sc=state.result.scored;
  const need=sc.filter(s=>s.c.streams!=='all'&&p.streams.some(k=>s.c.streams.includes(k))).slice(0,6).map(s=>s.c.title);
  const open=sc.filter(s=>s.c.streams==='all').slice(0,4).map(s=>s.c.title);
  return {need,open};
}

    <div class="progress-line"><span>Question ${state.i+1} of ${n}</span><span>${progressMsg(state.i,n,q)}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${state.i}"><i style="width:${state.i/n*100}%"></i></div>
    ${q.sub&&state.i>0&&!state.questions[state.i-1].sub?'<p class="hint" style="margin-top:1.5rem">Now a few questions about your school subjects.</p>':''}<p class="q-stem">${q.stem||'How much would you enjoy…'}</p>
    <h2 class="q-text" id="qtext" tabindex="-1">${q.text}</h2>
    <fieldset class="opts" aria-labelledby="qtext">${opts}</fieldset>
    <div class="quiz-foot"><button class="linkbtn" id="back"${state.i===0?' disabled':''}>Back</button><span>Tip: press 1 to 5 on your keyboard</span></div>
  </div>`;
}

function fit(n){return n>=0.8?['Excellent fit','top']:n>=0.6?['Strong fit','mid']:['Worth exploring','low'];}
function li(a){return a.map(x=>`<li>${x}</li>`).join('');}
function card(s,i){
  const c=s.c,[label,cls]=fit(s.norm);
  const open=c.streams==='all'?'Open to all subject groups':'Best with '+c.streams.map(x=>STREAMS[x].label).join(', ');
  const cols=collegesFor(c),top=cols.slice(0,6);
  const colBlock=top.length
    ?`<ul>${top.map(x=>`<li><strong>${x.i.n}</strong>, ${x.i.c} ${gradeChip(x.i.g)}${x.i.women?' <span class="tag">Women only</span>':''}${(admFor(x.i)||{}).st==='open'?' <span class="st st-open">Applications open</span>':''}</li>`).join('')}</ul>
      <p class="hint">Showing ${top.length} of ${cols.length} listed ${regionLabel()}. See the full list below for programmes and sources.</p>`
    :`<p class="none">No institution in our list matches this field ${regionLabel()} with these filters. Try another region a lower minimum grade, or another type, or search for A, A+ and A++ colleges in your state on naac.gov.in.</p>`;
  return `<details class="career"><summary>
    <span class="c-main"><h3><span class="ic" aria-hidden="true">${iconFor(c.title)}</span>${c.title}</h3><span class="c-sum">${c.summary}</span>
      <span class="c-meta"><span class="chip-fit ${cls}">${label}</span><span class="tag">${open}</span>${c.math?'<span class="tag">Maths-heavy</span>':''}</span>
      <span class="fit-bar" aria-hidden="true"><i style="width:${Math.round(30+70*s.norm)}%;animation-delay:${(i||0)*70}ms"></i></span></span>
    <span class="chev" aria-hidden="true"></span></summary>
    <div class="c-body">
      <div><h4>Degrees and courses</h4><ul>${li(c.courses)}</ul></div>
      <div><h4>How to get in</h4><p>${c.entry}</p></div>
      <div><h4>Where it can lead</h4><ul>${li(c.paths)}</ul></div>
      ${c.note?`<div class="c-wide c-note"><h4>Good to know</h4><p>${c.note}</p></div>`:''}
      <div class="c-wide"><h4>Colleges to explore ${regionLabel()}</h4>${colBlock}</div>
    </div></details>`;
}

function filtered(){
  const f=state.filters;
  return state.result.scored.filter(s=>{
    if(f.only&&state.stream&&state.stream!=='unsure'&&!streamOK(s.c,state.stream))return false;
    return true;
  });
}
function listHTML(){
  const items=filtered(),f=state.filters,shown=f.all?items:items.slice(0,8);
  if(!items.length)return `<p class="empty">Nothing matches these filters. Turn off one of them to see more options.</p>`;
  let h=`<p class="count">Showing ${shown.length} of ${items.length} options, best fit first.</p><div class="list">${shown.map(card).join('')}</div>`;
  if(!f.all&&items.length>8)h+=`<p class="more"><button class="btn ghost" data-act="all">Show all ${items.length} options</button></p>`;
  return h;
}
function collegesHTML(){
  const items=eligibleInst(true).sort((a,b)=>(streamCore(b)-streamCore(a))||(streamOverlap(b)>0)-(streamOverlap(a)>0)||GR[b.g]-GR[a.g]||b.cg-a.cg||a.n.localeCompare(b.n));
  const f=state.filters,shown=f.allC?items:items.slice(0,12);
  if(!items.length)return `<p class="empty">No institution in our list matches this region and grade. Choose another region or lower the minimum grade, or search naac.gov.in for accredited colleges in your state.</p>`;
  const tb=state.view2==='table';
  let h=`<div class="toggle noprint" role="group" aria-label="Layout"><button class="btn small${tb?' ghost':''}" data-act="cards" aria-pressed="${!tb}">Cards</button> <button class="btn small${tb?'':' ghost'}" data-act="table" aria-pressed="${tb}">Table with website column</button></div><p class="count">Showing ${shown.length} of ${items.length} institutions ${regionLabel()}, highest grade first.</p>${tb?tableHTML(shown):`<div class="insts">${shown.map(instCard).join('')}</div>`}`;
  if(!f.allC&&items.length>12)h+=`<p class="more"><button class="btn ghost" data-act="allc">Show all ${items.length} institutions</button></p>`;
  return h;
}

function results(){
  const r=state.result,top=r.ranked.slice(0,3);
  const nm=state.name.trim();
  const total=state.answers.reduce((a,b)=>a+b,0);
  const date=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  const streamOpts=Object.keys(STREAMS).map(k=>`<option value="${k}"${state.stream===k?' selected':''}>${STREAMS[k].label}</option>`).join('');
  const gradeOpts=[[1,'A, A+ and A++'],[2,'A+ and A++'],[3,'A++ only']].map(o=>`<option value="${o[0]}"${state.minGrade===o[0]?' selected':''}>${o[1]}</option>`).join('');
  const t3=top.map(t=>`<div class="t3"><h3>${TYPE[t].name} <span>${TYPE[t].full}, <b data-count="${Math.round(r.pct[t]*100)}">${pctText(r.pct[t])}</b></span></h3><p>${TYPE[t].blurb}</p><p class="school">${TYPE[t].school}</p></div>`).join('');
  return `<p class="print-only"><img src="${BRAND_MARK}" alt="" height="32"><strong>Arohaanex Edvantage</strong> | Ascend Hub. Prepared${nm?' for '+esc(nm):''} on ${date}</p>
  <div class="res-head">
    <div><h1>${nm?esc(nm)+'’s interest profile':'Your interest profile'}</h1>
    <p class="lead">Your strongest interests are ${TYPE[top[0]].name}, ${TYPE[top[1]].name} and ${TYPE[top[2]].name}. The options below are ranked by how well they match that mix.</p></div>
    <div class="actions noprint"><button class="btn" data-act="print">Print or save as PDF</button><button class="btn ghost" data-act="share">Share result picture</button><button class="btn ghost" data-act="retake">Retake the quiz</button></div>
  </div>
  ${closingBanner()}
  <div class="profile"><div>${typeBadge(top)}${hexSVG(r.pct,top)}</div><div class="top3">${t3}</div></div>
  ${total<24?'<p class="low-note">Most of your answers were low, so this profile is less reliable. Try again and think about what you would choose to do in your free time.</p>':''}
  <section class="block"><h2>Courses and careers that fit</h2>
    <div class="filters">
      <label class="f">Subject group <select id="f-stream">${streamOpts}</select></label>
      <label class="f"><input class="plain" type="checkbox" id="f-only"${state.filters.only?' checked':''}> Only options open to my group</label>
      <label class="f"><input class="plain" type="checkbox" id="f-focus"${state.focus?' checked':''}> Only colleges with programmes for my subject group</label>
      <label class="f">NAAC grade of colleges <select id="f-grade">${gradeOpts}</select></label>
      <label class="f">Show <select id="f-kind"><option value="all"${state.kind==='all'?' selected':''}>Colleges and universities</option><option value="u"${state.kind==='u'?' selected':''}>Universities only</option><option value="c"${state.kind==='c'?' selected':''}>Colleges only</option></select></label>
      <div class="regions"><p class="filter-title">Regions to study in</p><div class="chips">${regionChips()}</div></div>
    </div>
    <div id="list">${listHTML()}</div>
  </section>
  <section class="block"><h2>Accredited colleges and universities</h2>
    <p class="sub">Institutions from NAAC’s records that hold a grade of A, A+ or A++, filtered by the regions, type and minimum grade you chose above.</p>
    <div class="naac-note"><h3>How to read these NAAC grades</h3>
      <p>NAAC grades a whole institution out of 4.00: A++ is 3.51 to 4.00, A+ is 3.26 to 3.50 and A is 3.01 to 3.25. A grade does not approve a particular course, so also check UGC, AICTE, Bar Council or NMC approval where it applies.</p>
      <p>NAAC announced in February 2025 that it is moving from letter grades to “Accredited” with maturity levels. Institutions already on their second cycle or later keep their current grade until the new system starts, so a newly assessed college may show a level instead of a letter.</p>
      <p>Grades, CGPA scores and declaration dates come from NAAC’s own file of institutions with valid accreditation, dated 14 August 2025, as republished by CollegeJaancho.com. We could not open naac.gov.in directly, and NAAC updates its file, so confirm each college there before you apply. Colleges with a declaration date more than five years old are flagged.</p>
      <p>Science and medical students: IITs, NITs, IIITs, IISERs and AIIMS are mostly assessed through other systems (such as NIRF and NBA), so they are mostly not in this list. They admit through JEE, NEET and their own counselling, so check their own sites.</p>
      <p>This is a selection of well-known institutions, not every one: NAAC’s file has 313 universities and about 2,100 colleges with an A, A+ or A++ grade. If a college you like is missing, it may still be accredited, so search for it on naac.gov.in.</p>
    </div>
    <p class="hint" style="margin-top:1rem">Official website: “Confirmed” means we saw the address on the institution’s own pages while researching. “Check the address” means it comes from general knowledge and has not been confirmed yet, so check it matches the college name and ends in .ac.in, .edu.in or .edu. You can also cross-check any college on naac.gov.in and the UGC lists at ugc.gov.in.</p>
    <div id="colleges" style="margin-top:.6rem">${collegesHTML()}</div>
  </section>
  <section class="block" id="dates"><h2>Admission dates and deadlines</h2>
    <p class="sub">Admissions for the 2027 intake, last checked ${ADM_CHECKED}. These dates come from education portals reporting official notices; we could not open every official site directly, so confirm each date on the official link. “Expected” means the college has not published the date yet and the date is a projection from last year.</p>
    ${deadlinesHTML()}
    <p class="hint" style="margin-top:.8rem">Colleges not shown here still run their own admissions. Each college card above has an admissions box with an official link where we checked, or a search link where we did not.</p>
  </section>
  <section class="block"><h2>How to fill the application form online</h2>
    <p class="sub">The steps are similar at most colleges, but each site has its own screens and rules. Read the instructions on the official page before you start.</p>
    ${HOW_TO}
  </section>
  <section class="block"><h2>What to do next</h2>
    <ol class="steps">
      <li>Pick three options you would be happy to explore, not only the top one.</li>
      <li>Check each college’s current NAAC status, eligibility, entrance exam and last date on its official website, and put every deadline in your calendar.</li>
      <li>Talk to a teacher, a counsellor or someone who works in the field. Ask what a normal week looks like.</li>
      <li>Try it before you commit: a short course, a small project or a day of shadowing.</li>
    </ol>
  </section>
  ${brandFoot()}
  <p class="disclaimer">This is a career interest quiz, not a psychometric or aptitude test. It shows what you enjoy, not what you are good at, and it is one input among many. Course lists, entrance exams, eligibility and accreditation change every year. Confirm everything on the official university, exam and NAAC websites before you apply. Ascend Hub is a career guidance tool from Arohaanex Edvantage and is not affiliated with any institution it lists.</p>`;
}

/* ---------- LOGIC ---------- */
function compute(){
  const sums={R:0,I:0,A:0,S:0,E:0,C:0},subs={};
  state.questions.forEach((q,i)=>{const v=state.answers[i]||0;if(q.sub)subs[q.sub]=v;else sums[q.t]+=v;});
  const pct={};ORDER.forEach(t=>pct[t]=sums[t]/20);
  const ranked=[...ORDER].sort((a,b)=>pct[b]-pct[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const dots=CAREERS.map(c=>[3,2,1].reduce((d,w,k)=>d+w*pct[c.code[k]],0)/6);
  const min=Math.min(...dots),max=Math.max(...dots);
  const scored=CAREERS.map((c,i)=>({c,dot:dots[i],norm:max>min?(dots[i]-min)/(max-min):0.7}));
  scored.sort((a,b)=>b.dot-a.dot||a.c.title.localeCompare(b.c.title));
  state.result={pct,ranked,scored,subs};
  if(state.level==='after10')state.result.paths=scorePaths(pct,subs);
}

function render(){
  const v=state.view;
  app.innerHTML=v==='welcome'?welcome():v==='quiz'?quiz():v==='loading'?loadingView():v==='teachers'?teachers():(state.level==='after10'?results10():results());
  syncNav();
}
function refresh(){
  document.getElementById('list').innerHTML=listHTML();
  document.getElementById('colleges').innerHTML=collegesHTML();
}
function go(view){
  state.view=view;render();window.scrollTo(0,0);
  try{if(view==='teachers')history.replaceState(null,'','#educators');else if(isEd(location.hash))history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  const target=(view==='results'||view==='teachers')?app.querySelector('h1'):view==='quiz'?document.getElementById('qtext'):null;
  if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}
  if(view==='results')animateCounts();
}
function answer(v){
  state.answers[state.i]=v;
  const idx=state.i;
  setTimeout(()=>{
    if(state.view!=='quiz'||state.i!==idx)return;
    if(idx<state.questions.length-1){state.i++;render();const q=document.getElementById('qtext');if(q)q.focus({preventScroll:true});}
    else{compute();state.view='loading';render();window.scrollTo(0,0);setTimeout(()=>{if(state.view==='loading')go('results');},reducedMotion()?250:1500);}
  },240);
}
function setRegions(t){
  const boxes=[...app.querySelectorAll('input[name="region"]')];
  if(t.value==='any'&&t.checked){state.regions=['any'];}
  else{
    const sel=boxes.filter(b=>b.checked&&b.value!=='any').map(b=>b.value);
    state.regions=sel.length?sel:['any'];
  }
  boxes.forEach(b=>{b.checked=state.regions.includes(b.value);});
}

/* ---------- EVENTS ---------- */
app.addEventListener('submit',e=>{
  if(e.target.id==='treq'){
    e.preventDefault();
    const inp=document.getElementById('t-files'),files=inp&&inp.files?Array.from(inp.files):[];
    const errs=checkFiles(files),box=document.getElementById('t-files-err');
    if(box){box.textContent=errs.join(' ');box.hidden=!errs.length;}
    if(errs.length)return;
    showRequest(new FormData(e.target),files);return;}
  if(e.target.id!=='start')return;
  e.preventDefault();
  const lv=app.querySelector('input[name="level"]:checked');
  state.level=lv?lv.value:state.level;
  state.name=document.getElementById('name').value;
  if(state.level==='after10'){
    state.stream='unsure';state.questions=buildQuestions('unsure').concat(subjectQuestions());
  }else{
    const sel=app.querySelector('input[name="stream"]:checked');
    if(!sel){document.getElementById('err').hidden=false;return;}
    state.stream=sel.value;state.questions=buildQuestions(state.stream);
  }
  state.answers=[];state.i=0;
  go('quiz');
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='level'){const nm=document.getElementById('name');if(nm)state.name=nm.value;state.level=t.value;render();return;}
  if(t.id==='t-files'){
    const arr=Array.from(t.files||[]),errs=checkFiles(arr),box=document.getElementById('t-files-err'),list=document.getElementById('t-files-list');
    if(box){box.textContent=errs.join(' ');box.hidden=!errs.length;}
    if(list)list.innerHTML=arr.map(f=>'<li>'+esc(f.name)+' ('+fmtSize(f.size)+')</li>').join('');
    return;}
  if(t.name==='ans'){answer(parseInt(t.value,10));return;}
  if(t.name==='stream'){const err=document.getElementById('err');if(err)err.hidden=true;return;}
  if(t.name==='region'){setRegions(t);if(state.view==='results'){state.filters.allC=false;refresh();}return;}
  if(t.id==='f-stream'){state.stream=t.value;}
  else if(t.id==='f-only'){state.filters.only=t.checked;}
  else if(t.id==='f-grade'){state.minGrade=parseInt(t.value,10);}
  else if(t.id==='f-kind'){state.kind=t.value;}
  else if(t.id==='f-focus'){state.focus=t.checked;}
  else return;
  state.filters.all=false;state.filters.allC=false;
  refresh();
});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='back'&&state.i>0){state.i--;render();const q=document.getElementById('qtext');if(q)q.focus({preventScroll:true});return;}
  const act=b.dataset.act;
  if(act==='all'){state.filters.all=true;refresh();}
  else if(act==='allc'){state.filters.allC=true;refresh();}
  else if(act==='cards'||act==='table'){state.view2=act;refresh();}
  else if(act==='teachers')go('teachers');
  else if(act==='home')go('welcome');
  else if(act==='share')shareCard();
  else if(act==='copy')copyRequest(b);
  else if(act==='sample'){const pl=document.getElementById('t-plan');if(pl)pl.value='Free sample request';const f=document.getElementById('treq');if(f){f.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});const n=document.getElementById('t-name');if(n)n.focus({preventScroll:true});}}
  else if(act==='pick'){const sel=document.getElementById('t-type');if(sel)sel.value=b.dataset.t;const f=document.getElementById('treq');if(f){f.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});const n=document.getElementById('t-name');if(n)n.focus({preventScroll:true});}}
  else if(act==='print'){window.print();}
  else if(act==='retake'){state.answers=[];state.i=0;state.questions=[];state.result=null;state.filters={only:true,all:false,allC:false};go('welcome');}
});
document.addEventListener('keydown',e=>{
  if(state.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=5){
    const r=app.querySelector(`input[name="ans"][value="${n-1}"]`);
    if(r){r.checked=true;answer(n-1);}
  }
});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=el.dataset.count+'%';});document.querySelectorAll('details.career').forEach(d=>{d.dataset.was=d.open?'1':'0';d.open=true;});});
window.addEventListener('afterprint',()=>{document.querySelectorAll('details.career').forEach(d=>{d.open=d.dataset.was==='1';});});

document.querySelector('.site-head').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.act==='teachers')go('teachers');else if(b.dataset.act==='home')go('welcome');});
window.addEventListener('hashchange',()=>{if(isEd(location.hash)&&state.view!=='teachers')go('teachers');});
if(isEd(location.hash))state.view='teachers';
document.getElementById('brand-mark').src=BRAND_MARK;
render();
</script>
</body>
</html>
